<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Purple Draw</title>
<style>
  :root {
    --bg: #12081c;
    --panel: #1e1230;
    --ink: #f3e8ff;
    --accent: #c084fc;
    --muted: #a78bba;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, system-ui, Segoe UI, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid #3b2760;
  }
  header {
    border-bottom-color: #3b2760;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 700; flex: 1; }
  header .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 12px #a855f788;
  }
  #toolbar {
    display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border-bottom: 1px solid #3b2760;
  }
  button {
    border: 0; border-radius: 12px; padding: 9px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: #2d1f4a; color: var(--ink);
  }
  button.active, button:active { background: var(--accent); color: #1a0b2e; }
  button.danger { background: #3a2140; color: #ffb4c8; }
  button.ghost { background: #2a1a45; }
  #stage {
    flex: 1; position: relative; min-height: 0;
    background:
      radial-gradient(circle at 20% 20%, #2a1848 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, #1a0f30 0%, transparent 35%),
      var(--bg);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: #0008; padding: 8px 14px; border-radius: 999px;
    font-size: 12px; pointer-events: none; transition: opacity .4s; max-width: 90%;
    text-align: center;
  }
  #hint.hide { opacity: 0; }
  #studio {
    display: none; background: var(--panel); border-top: 1px solid #3b2760;
    padding: 10px 12px 14px; max-height: 42%; overflow-y: auto;
  }
  #studio.open { display: block; }
  .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row label { font-size: 12px; color: var(--muted); min-width: 72px; }
  .row input[type=range] { flex: 1; min-width: 120px; }
  .val { font-size: 12px; min-width: 36px; color: var(--accent); }
  #colorPreview {
    width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid #fff3; box-shadow: 0 0 16px #0006;
    background: hsl(280 80% 55%);
  }
  #brushList { display: flex; gap: 8px; flex-wrap: wrap; }
  .brushChip {
    width: 52px; height: 52px; border-radius: 14px; background: #2a1a45;
    border: 2px solid transparent; display: flex; align-items: center;
    justify-content: center; cursor: pointer; position: relative; padding: 0;
  }
  .brushChip.on { border-color: var(--accent); }
  .brushChip canvas { width: 40px; height: 40px; }
  .brushChip .nm {
    position: absolute; bottom: 2px; left: 0; right: 0; text-align: center;
    font-size: 8px; color: #e9d5ff; pointer-events: none;
  }
  select {
    background: #2a1a45; color: var(--ink); border: 0; border-radius: 10px;
    padding: 8px 10px; font-weight: 600;
  }
  .tiny { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="dot" title="Purple"></div>
    <h1>Purple Draw</h1>
  </header>
  <div id="toolbar">
    <button id="btnDraw" class="active">✏️ Draw</button>
    <button id="btnBrain">🧠 Brain</button>
    <button id="btnAuto">✨ Auto</button>
    <button id="btnStudio" class="ghost">🎨 Brushes</button>
    <button id="btnClear" class="danger">Clear</button>
    <button id="btnSave">Save 📷</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">Purple only — no flies, just a purple paint tip. Tap 🧠 or ✨</div>
  </div>
  <div id="studio">
    <p class="tiny">This instance is locked to purple (lightness only)</p>
    <div class="row">
      <div id="colorPreview"></div>
      <div style="flex:1; min-width:160px">
        <div class="row">
          <label>Light</label>
          <input id="light" type="range" min="25" max="75" value="55" />
          <span class="val" id="lightV">55%</span>
        </div>
      </div>
    </div>
    <p class="tiny">Brush maker</p>
    <div class="row">
      <label>Shape</label>
      <select id="shape">
        <option value="round">Round soft</option>
        <option value="hard">Round hard</option>
        <option value="calligraphy">Calligraphy</option>
        <option value="spray">Spray</option>
        <option value="square">Square</option>
      </select>
    </div>
    <div class="row">
      <label>Size</label>
      <input id="size" type="range" min="2" max="64" value="14" />
      <span class="val" id="sizeV">14</span>
    </div>
    <div class="row">
      <label>Opacity</label>
      <input id="opacity" type="range" min="10" max="100" value="90" />
      <span class="val" id="opacityV">90%</span>
    </div>
    <div class="row">
      <label>Spacing</label>
      <input id="spacing" type="range" min="5" max="80" value="18" />
      <span class="val" id="spacingV">18%</span>
    </div>
    <div class="row">
      <button id="btnSaveBrush" class="active">+ Save as my brush</button>
      <button id="btnUseNow" class="ghost">Use these settings now</button>
    </div>
    <p class="tiny">Your brushes</p>
    <div id="brushList"></div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const studio = document.getElementById('studio');
  const colorPreview = document.getElementById('colorPreview');

  // Locked purple for this instance
  const PURPLE_HUE = 280;
  let hue = PURPLE_HUE, sat = 80, light = 55;
  let mode = 'draw';
  let drawing = false;
  let brushTip = { x: 0, y: 0, a: 0, vx: 0, vy: 0 };
  let last = null;
  let autoT = 0;
  let brainPath = [];
  let brainI = 0;
  let dpr = 1;
  let inkSnap = null;
  let distAcc = 0;
  let stampsSincePick = 0;

  const brush = {
    shape: 'round',
    size: 14,
    opacity: 0.9,
    spacing: 0.18,
    name: 'Soft'
  };

  let customBrushes = [];
  try {
    customBrushes = JSON.parse(localStorage.getItem('purpledraw_brushes') || '[]');
  } catch (_) { customBrushes = []; }

  const starter = [
    { name: 'Ink', shape: 'hard', size: 6, opacity: 1, spacing: 0.08 },
    { name: 'Soft', shape: 'round', size: 18, opacity: 0.55, spacing: 0.12 },
    { name: 'Marker', shape: 'calligraphy', size: 16, opacity: 0.85, spacing: 0.1 },
    { name: 'Spray', shape: 'spray', size: 28, opacity: 0.35, spacing: 0.25 },
    { name: 'Block', shape: 'square', size: 20, opacity: 0.9, spacing: 0.12 }
  ];

  function hsl() {
    return `hsl(${PURPLE_HUE} ${sat}% ${light}%)`;
  }

  function inventPurpleShade() {
    hue = PURPLE_HUE;
    sat = 70 + Math.floor(Math.random() * 25);
    light = 35 + Math.floor(Math.random() * 35);
    updateColorUI();
  }

  function maybeSwitchShade() {
    stampsSincePick++;
    if (stampsSincePick > 18 + Math.floor(Math.random() * 30)) {
      stampsSincePick = 0;
      inventPurpleShade();
      if (Math.random() < 0.2) {
        const shapes = ['round', 'hard', 'calligraphy', 'spray', 'square'];
        brush.shape = shapes[Math.floor(Math.random() * shapes.length)];
        brush.size = 8 + Math.floor(Math.random() * 28);
        brush.opacity = 0.4 + Math.random() * 0.55;
      }
    }
  }

  function updateColorUI() {
    hue = PURPLE_HUE;
    colorPreview.style.background = hsl();
    document.getElementById('lightV').textContent = light + '%';
    document.getElementById('light').value = light;
  }

  document.getElementById('light').oninput = (e) => {
    light = +e.target.value; updateColorUI();
  };
  document.getElementById('size').oninput = (e) => {
    brush.size = +e.target.value;
    document.getElementById('sizeV').textContent = brush.size;
  };
  document.getElementById('opacity').oninput = (e) => {
    brush.opacity = +e.target.value / 100;
    document.getElementById('opacityV').textContent = e.target.value + '%';
  };
  document.getElementById('spacing').oninput = (e) => {
    brush.spacing = +e.target.value / 100;
    document.getElementById('spacingV').textContent = e.target.value + '%';
  };
  document.getElementById('shape').onchange = (e) => { brush.shape = e.target.value; };

  function applyBrush(b) {
    brush.shape = b.shape;
    brush.size = b.size;
    brush.opacity = b.opacity;
    brush.spacing = b.spacing;
    brush.name = b.name || brush.name;
    document.getElementById('shape').value = brush.shape;
    document.getElementById('size').value = brush.size;
    document.getElementById('sizeV').textContent = brush.size;
    document.getElementById('opacity').value = Math.round(brush.opacity * 100);
    document.getElementById('opacityV').textContent = Math.round(brush.opacity * 100) + '%';
    document.getElementById('spacing').value = Math.round(brush.spacing * 100);
    document.getElementById('spacingV').textContent = Math.round(brush.spacing * 100) + '%';
  }

  function paintBrushPreview(c2, b, col) {
    const g = c2.getContext('2d');
    const s = 40;
    c2.width = s; c2.height = s;
    g.clearRect(0, 0, s, s);
    stamp(g, s / 2, s / 2, { ...b, size: Math.min(22, b.size) }, col || '#a855f7');
  }

  function renderBrushList() {
    const box = document.getElementById('brushList');
    box.innerHTML = '';
    const all = [...starter, ...customBrushes];
    all.forEach((b, i) => {
      const chip = document.createElement('button');
      chip.className = 'brushChip' + (brush.name === b.name && brush.shape === b.shape ? ' on' : '');
      const mini = document.createElement('canvas');
      paintBrushPreview(mini, b, hsl());
      chip.appendChild(mini);
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = b.name;
      chip.appendChild(nm);
      chip.onclick = () => {
        applyBrush(b);
        renderBrushList();
      };
      if (i >= starter.length) {
        chip.ondblclick = () => {
          customBrushes = customBrushes.filter(x => x !== b);
          localStorage.setItem('purpledraw_brushes', JSON.stringify(customBrushes));
          renderBrushList();
        };
      }
      box.appendChild(chip);
    });
  }

  document.getElementById('btnSaveBrush').onclick = () => {
    const name = prompt('Name your brush:', brush.shape + ' ' + brush.size) || ('Brush ' + (customBrushes.length + 1));
    const b = {
      name,
      shape: brush.shape,
      size: brush.size,
      opacity: brush.opacity,
      spacing: brush.spacing
    };
    customBrushes.push(b);
    localStorage.setItem('purpledraw_brushes', JSON.stringify(customBrushes));
    applyBrush(b);
    renderBrushList();
  };
  document.getElementById('btnUseNow').onclick = () => {
    studio.classList.remove('open');
    hint.textContent = 'Purple brush ready — still no flies!';
    hint.classList.remove('hide');
    setTimeout(() => hint.classList.add('hide'), 2500);
  };

  function stamp(g, x, y, b, col) {
    const sz = b.size;
    g.save();
    g.globalAlpha = b.opacity;
    if (b.shape === 'round') {
      const grd = g.createRadialGradient(x, y, 0, x, y, sz / 2);
      grd.addColorStop(0, col);
      grd.addColorStop(1, 'transparent');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(x, y, sz / 2, 0, Math.PI * 2);
      g.fill();
    } else if (b.shape === 'hard') {
      g.fillStyle = col;
      g.beginPath();
      g.arc(x, y, sz / 2, 0, Math.PI * 2);
      g.fill();
    } else if (b.shape === 'calligraphy') {
      g.fillStyle = col;
      g.translate(x, y);
      g.rotate(brushTip.a || 0);
      g.beginPath();
      g.ellipse(0, 0, sz * 0.55, sz * 0.18, 0, 0, Math.PI * 2);
      g.fill();
    } else if (b.shape === 'square') {
      g.fillStyle = col;
      g.fillRect(x - sz / 2, y - sz / 2, sz, sz);
    } else if (b.shape === 'spray') {
      g.fillStyle = col;
      for (let i = 0; i < 18; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.random() * sz / 2;
        const px = x + Math.cos(ang) * rad;
        const py = y + Math.sin(ang) * rad;
        g.globalAlpha = b.opacity * (0.2 + Math.random() * 0.8);
        g.beginPath();
        g.arc(px, py, 0.6 + Math.random() * 1.8, 0, Math.PI * 2);
        g.fill();
      }
    }
    g.restore();
  }

  function strokeTo(x, y) {
    if (!last) { last = { x, y }; distAcc = 0; return; }
    const dx = x - last.x, dy = y - last.y;
    const dist = Math.hypot(dx, dy);
    const step = Math.max(1, brush.size * brush.spacing);
    distAcc += dist;
    while (distAcc >= step) {
      const t = 1 - (distAcc - step) / (dist || 1);
      const px = last.x + dx * Math.min(1, Math.max(0, t));
      const py = last.y + dy * Math.min(1, Math.max(0, t));
      stamp(ctx, px, py, brush, hsl());
      if (mode === 'auto' || mode === 'brain') maybeSwitchShade();
      distAcc -= step;
    }
    last = { x, y };
  }

  function resize() {
    const stage = document.getElementById('stage');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    brushTip.x = stage.clientWidth / 2;
    brushTip.y = stage.clientHeight / 2;
  }

  function clear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    last = null;
  }

  function posFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function captureInk() {
    inkSnap = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }

  // Plain purple circle tip — NOT a fly, not wings, not a body
  function paintCursor(x, y) {
    if (inkSnap) ctx.putImageData(inkSnap, 0, 0);
    ctx.save();
    ctx.translate(x, y);
    const col = hsl();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(10, brush.size * 0.55), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function onDown(e) {
    e.preventDefault();
    hint.classList.add('hide');
    if (mode === 'auto') return;
    drawing = true;
    const p = posFromEvent(e);
    brushTip.x = p.x; brushTip.y = p.y;
    last = { x: p.x, y: p.y };
    distAcc = 0;
    stamp(ctx, p.x, p.y, brush, hsl());
    captureInk();
    paintCursor(brushTip.x, brushTip.y);
  }
  function onMove(e) {
    e.preventDefault();
    if (!drawing || mode === 'auto') return;
    const p = posFromEvent(e);
    const dx = p.x - brushTip.x, dy = p.y - brushTip.y;
    brushTip.a = Math.atan2(dy, dx);
    brushTip.x = p.x; brushTip.y = p.y;
    strokeTo(p.x, p.y);
    captureInk();
    paintCursor(brushTip.x, brushTip.y);
  }
  function onUp(e) {
    e.preventDefault();
    drawing = false;
    last = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });

  function makeBrainArt(cx, cy, s) {
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const t = (i / 80) * Math.PI * 4;
      const r = s * (0.15 + 0.35 * (i / 80));
      pts.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r * 0.75]);
    }
    for (let i = 0; i <= 50; i++) {
      const t = (i / 50) * Math.PI * 2;
      pts.push([cx + Math.cos(t * 2) * s * 0.4, cy + Math.sin(t * 3) * s * 0.28]);
    }
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      pts.push([
        cx - s * 0.5 + t * s,
        cy + Math.sin(t * Math.PI * 3) * s * 0.2
      ]);
    }
    return pts;
  }

  function setActive(id) {
    ['btnDraw', 'btnBrain', 'btnAuto'].forEach(x => {
      document.getElementById(x).classList.toggle('active', x === id);
    });
  }

  function startBrain() {
    mode = 'brain';
    setActive('btnBrain');
    studio.classList.remove('open');
    inventPurpleShade();
    const w = canvas.width / dpr, h = canvas.height / dpr;
    brainPath = makeBrainArt(w / 2, h / 2 - 10, Math.min(w, h) * 0.32);
    brainI = 0;
    last = null;
    distAcc = 0;
    stampsSincePick = 0;
    brushTip.x = brainPath[0][0];
    brushTip.y = brainPath[0][1];
    hint.textContent = 'Brain painting in purple…';
    hint.classList.remove('hide');
    setTimeout(() => hint.classList.add('hide'), 2000);
  }

  function startAuto() {
    mode = 'auto';
    setActive('btnAuto');
    studio.classList.remove('open');
    inventPurpleShade();
    autoT = 0;
    last = null;
    distAcc = 0;
    stampsSincePick = 0;
    const w = canvas.width / dpr, h = canvas.height / dpr;
    brushTip.x = w / 2; brushTip.y = h / 2;
    brushTip.vx = 2.2; brushTip.vy = 1.4;
    hint.textContent = 'Auto painting purple shades!';
    hint.classList.remove('hide');
    setTimeout(() => hint.classList.add('hide'), 2000);
  }

  document.getElementById('btnDraw').onclick = () => {
    mode = 'draw'; setActive('btnDraw'); last = null;
  };
  document.getElementById('btnBrain').onclick = startBrain;
  document.getElementById('btnAuto').onclick = startAuto;
  document.getElementById('btnStudio').onclick = () => {
    studio.classList.toggle('open');
    document.getElementById('btnStudio').classList.toggle('active', studio.classList.contains('open'));
    renderBrushList();
  };
  document.getElementById('btnClear').onclick = () => {
    clear(); captureInk(); paintCursor(brushTip.x, brushTip.y);
  };
  document.getElementById('btnSave').onclick = () => {
    if (inkSnap) ctx.putImageData(inkSnap, 0, 0);
    const a = document.createElement('a');
    a.download = 'purple-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    paintCursor(brushTip.x, brushTip.y);
  };

  function tick() {
    if (mode === 'brain' && brainPath.length) {
      if (brainI < brainPath.length) {
        const [x, y] = brainPath[brainI];
        const dx = x - brushTip.x, dy = y - brushTip.y;
        brushTip.a = Math.atan2(dy, dx);
        brushTip.x = x; brushTip.y = y;
        if (brainI % 10 === 0) inventPurpleShade();
        strokeTo(x, y);
        brainI++;
        captureInk();
        paintCursor(brushTip.x, brushTip.y);
      } else {
        mode = 'draw';
        setActive('btnDraw');
        last = null;
      }
    } else if (mode === 'auto') {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      autoT += 0.04;
      brushTip.vx += Math.sin(autoT * 1.7) * 0.35 + (Math.random() - 0.5) * 0.25;
      brushTip.vy += Math.cos(autoT * 1.3) * 0.35 + (Math.random() - 0.5) * 0.25;
      const sp = Math.hypot(brushTip.vx, brushTip.vy) || 1;
      brushTip.vx = (brushTip.vx / sp) * 3.2;
      brushTip.vy = (brushTip.vy / sp) * 3.2;
      brushTip.x += brushTip.vx;
      brushTip.y += brushTip.vy;
      brushTip.a = Math.atan2(brushTip.vy, brushTip.vx);
      if (brushTip.x < 20 || brushTip.x > w - 20) brushTip.vx *= -1;
      if (brushTip.y < 20 || brushTip.y > h - 20) brushTip.vy *= -1;
      brushTip.x = Math.max(20, Math.min(w - 20, brushTip.x));
      brushTip.y = Math.max(20, Math.min(h - 20, brushTip.y));
      strokeTo(brushTip.x, brushTip.y);
      captureInk();
      paintCursor(brushTip.x, brushTip.y);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    const prev = canvas.toDataURL();
    resize();
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
      captureInk();
      paintCursor(brushTip.x, brushTip.y);
    };
    img.src = prev;
  });

  updateColorUI();
  applyBrush(starter[1]);
  renderBrushList();
  resize();
  captureInk();
  paintCursor(brushTip.x, brushTip.y);
  requestAnimationFrame(tick);
  setTimeout(() => hint.classList.add('hide'), 5500);
})();
</script>
</body>
</html>
