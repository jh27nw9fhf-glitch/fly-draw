<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Purple Draw</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: #222;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #toolbar { display: flex; gap: 10px; padding: 10px; align-items: center;
    background: #f5f0ff; border-bottom: 1px solid #e0d4f7; flex-wrap: wrap; }
  #toolbar strong { color: #7c3aed; font-size: 14px; margin-right: 4px; }
  #swatch { width: 24px; height: 24px; border-radius: 50%; background: #a855f7; border: 2px solid #7c3aed; }
  label { font-size: 13px; color: #666; }
  input[type=range] { width: 100px; }
  button { border: 0; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: #a855f7; color: #fff; }
  button:active { background: #7c3aed; }
  button.secondary { background: #eee; color: #444; }
  #stage { flex: 1; min-height: 0; background: #fff; position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap">
  <div id="toolbar">
    <strong>Purple Draw</strong>
    <div id="swatch" title="Purple"></div>
    <label>Size</label>
    <input id="size" type="range" min="4" max="60" value="16" />
    <button id="btnClear" class="secondary" type="button">Clear</button>
    <button id="btnSave" type="button">Save</button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<script>
(() => {
  const PURPLE = '#a855f7';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let size = 16, drawing = false, last = null, dpr = 1;

  document.getElementById('size').oninput = (e) => { size = +e.target.value; };

  function resize() {
    const stage = document.getElementById('stage');
    const prev = canvas.width ? canvas.toDataURL() : null;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = PURPLE;
    ctx.fillStyle = PURPLE;
    if (prev) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
      img.src = prev;
    }
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function stamp(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function strokeTo(x, y) {
    if (!last) { last = { x, y }; stamp(x, y); return; }
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.stroke();
    last = { x, y };
  }

  function onDown(e) {
    e.preventDefault();
    drawing = true;
    const p = pos(e);
    last = null;
    strokeTo(p.x, p.y);
  }
  function onMove(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = pos(e);
    strokeTo(p.x, p.y);
  }
  function onUp(e) {
    e.preventDefault();
    drawing = false;
    last = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });

  document.getElementById('btnClear').onclick = () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = PURPLE;
    ctx.fillStyle = PURPLE;
  };
  document.getElementById('btnSave').onclick = () => {
    const a = document.createElement('a');
    a.download = 'purple-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
