<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23c084fc'/%3E%3C/svg%3E" />
  <title>Purple Draw</title>
  <meta name="fly-draw-build" content="a10235e39b" />
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f5f7;
    --ink: #333333;
    --accent: #c084fc;
    --muted: #666666;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #ffffff; color: var(--ink);
    font-family: -apple-system, system-ui, Segoe UI, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; background: #ffffff; }
  header {
    display: flex; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid #ddd;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 700; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border-bottom: 1px solid #ddd;
  }
  button {
    border: 0; border-radius: 12px; padding: 9px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: #eee; color: var(--ink);
  }
  button:active, button.active { background: var(--accent); color: #1a0b2e; }
  button.danger { background: #ffe4e6; color: #be123c; }
  #toolbar label, #colors label { font-size: 12px; color: var(--muted); }
  #toolbar input[type=range] { width: 90px; accent-color: var(--accent); }
  .ctrl { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .actions { display: flex; gap: 8px; flex: none; }
  #colors {
    display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 10px;
    background: var(--panel); border-bottom: 1px solid #ddd;
  }
  #hueBar, #satBar {
    height: 26px; border-radius: 8px; position: relative;
    border: 2px solid #ddd; touch-action: none; cursor: crosshair;
  }
  #hueBar {
    background: linear-gradient(to right,
      hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%),
      hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
  }
  .knob {
    position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #000a;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #stage {
    flex: 1; position: relative; min-height: 0;
    background: #ffffff; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; background: #ffffff; }
  #swatch {
    width: 28px; height: 28px; border-radius: 8px;
    border: 2px solid #ddd; background: hsl(280 80% 55%);
  }
  #practiceNote {
    margin: 0; padding: 7px 12px; min-height: 72px; flex: none;
    display: flex; align-items: center;
    background: #f3e8ff; color: #6b21a8;
    font-size: 14px; font-weight: 700; line-height: 1.35;
    border-bottom: 1px solid #e9d5ff;
  }
  #inventRow {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 10px;
    background: #faf5ff; border-bottom: 2px solid #c084fc;
  }
  #btnInvent {
    flex: none; min-height: 44px; border: 2px solid #c084fc;
    background: #ffffff; color: #6b21a8;
  }
  #btnInvent[aria-pressed="true"] { background: #c084fc; color: #1a0b2e; }
  #inventHint {
    margin: 0; flex: 1; min-width: 160px;
    font-size: 13px; font-weight: 700; color: #6b21a8; line-height: 1.3;
  }
  #brushHud {
    margin: 0; padding: 2px 12px 7px;
    background: #f3e8ff; color: #6b21a8;
    font-size: 12px; font-weight: 700; line-height: 1.35;
    border-bottom: 1px solid #e9d5ff;
  }
  #brushHud[hidden] { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Purple Draw</h1>
  </header>
  <div id="toolbar">
    <div id="swatch" title="Color"></div>
    <div class="ctrl">
      <label for="light">Light</label>
      <input id="light" type="range" min="15" max="85" value="55" />
    </div>
    <div class="ctrl">
      <label for="size">Size</label>
      <input id="size" type="range" min="4" max="48" value="14" />
    </div>
    <div class="actions">
      <button id="btnAuto" type="button" aria-pressed="false" title="The fly paints his best Starry Night, then keeps doing better until it is basically a replica">Autopilot</button>
      <button id="btnStarry" type="button" aria-pressed="false" title="Paint The Starry Night">Starry Night</button>
      <button id="btnClear" class="danger" type="button">Clear</button>
      <button id="btnSave" type="button">Save</button>
    </div>
  </div>
  <div id="inventRow">
    <button id="btnInvent" type="button" aria-pressed="false" aria-describedby="inventHint" title="Turn this on and the fly invents brush size and shape, then keeps fixing them until the painting is a replica">Fly makes brushes</button>
    <p id="inventHint">Off. Turn this on and the fly decides brush size and shape, then keeps fixing them until the painting is a replica.</p>
  </div>
  <p id="practiceNote" role="status" aria-live="polite">The fly paints his best Starry Night, then keeps doing better until it is basically a replica.</p>
  <p id="brushHud" hidden>The fly has not made a brush yet.</p>
  <div id="colors">
    <div id="hueBar" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><div class="knob" id="hueKnob"></div></div>
    <div id="satBar" role="slider" aria-label="Saturation" aria-valuemin="0" aria-valuemax="100"><div class="knob" id="satKnob"></div></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const swatch = document.getElementById('swatch');
  const hueBar = document.getElementById('hueBar');
  const satBar = document.getElementById('satBar');
  const hueKnob = document.getElementById('hueKnob');
  const satKnob = document.getElementById('satKnob');
  const lightInput = document.getElementById('light');
  const btnAuto = document.getElementById('btnAuto');
  const btnStarry = document.getElementById('btnStarry');
  const btnInvent = document.getElementById('btnInvent');
  const inventHint = document.getElementById('inventHint');
  let hue = 280, sat = 80, light = 55, size = 14, dpr = 1;
  let drawing = false;
  let pointerId = null;
  let touchId = null;
  let last = null;
  let autoOn = false;
  let starryOn = false;
  let starryPlan = [];
  let starryIdx = 0;
  let starryLast = null;
  let starryLastTs = 0;
  let picking = false;
  let savedColor = null;
  let autoLast = null;
  let flyPlan = [];
  let flyIdx = 0;
  let flyPhase = 0;
  let flyLastTs = 0;
  // Autopilot paints its best Starry Night first, then keeps comparing,
  // critiquing, and fixing until the canvas is basically a replica.
  const PRACTICE_HINT = "The fly paints his best Starry Night, then keeps doing better until it is basically a replica.";
  const MAX_LOOKS = 12;
  const FIX_AMOUNT = 0.62;
  // Mean per-pixel color gap (sum of red, green, and blue). Identity is 0.
  // Stay under this before calling the painting a replica.
  const REPLICA_DISTANCE = 2.5;
  let lookPass = 0;
  let lookPhase = 'idle';
  let critiquePauseUntil = 0;
  let critiqueText = '';
  let fixingText = '';
  let lastIssues = [];
  let lastDistance = null;
  let lastStats = '';
  let flyMemory = null;
  let refCanvas = null;
  let refKey = '';
  let practiceDone = false;
  // Off by default. When on, the fly invents a brush for each stroke, then
  // fixes brushes that do not match the real painting.
  let inventOn = false;
  let roundFirstBrush = null;
  let roundMinD = 0;
  let roundMaxD = 0;
  let roundShapeKeys = Object.create(null);
  let brushLayer = null;
  let brushSnap = null;
  let strokeOpen = false;
  let activePts = [];
  let activeBrush = null;
  let activeColor = null;
  let directCount = 0;
  const touchDevice = navigator.maxTouchPoints > 0;

  function hsl() { return `hsl(${hue} ${sat}% ${light}%)`; }
  function updateColorUI() {
    swatch.style.background = hsl();
    satBar.style.background = `linear-gradient(to right, hsl(${hue} 0% ${light}%), hsl(${hue} 100% ${light}%))`;
    hueKnob.style.left = (hue / 360 * 100) + '%';
    satKnob.style.left = sat + '%';
    lightInput.value = String(Math.round(light));
    hueBar.setAttribute('aria-valuenow', String(Math.round(hue)));
    satBar.setAttribute('aria-valuenow', String(Math.round(sat)));
  }
  function rememberPick() {
    if ((autoOn || starryOn) && savedColor) savedColor = { hue, sat, light };
  }
  function bindBar(el, apply) {
    function at(e) {
      const r = el.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
    }
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      picking = true;
      apply(at(e));
      updateColorUI();
      rememberPick();
    });
    el.addEventListener('pointermove', (e) => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      e.preventDefault();
      apply(at(e));
      updateColorUI();
      rememberPick();
    });
    const end = () => { picking = false; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  bindBar(hueBar, (t) => { hue = t * 360; });
  bindBar(satBar, (t) => { sat = t * 100; });

  lightInput.oninput = (e) => {
    light = +e.target.value;
    updateColorUI();
    rememberPick();
  };
  document.getElementById('size').oninput = (e) => { size = +e.target.value; };

  function resize() {
    if (strokeOpen) finishStroke();
    const stage = document.getElementById('stage');
    const nextDpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssW = Math.max(1, stage.clientWidth);
    const cssH = Math.max(1, stage.clientHeight);
    const nextW = Math.max(1, Math.round(cssW * nextDpr));
    const nextH = Math.max(1, Math.round(cssH * nextDpr));
    if (canvas.width === nextW && canvas.height === nextH && dpr === nextDpr) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return;
    }
    const snap = document.createElement('canvas');
    snap.width = canvas.width;
    snap.height = canvas.height;
    snap.getContext('2d').drawImage(canvas, 0, 0);
    dpr = nextDpr;
    canvas.width = nextW;
    canvas.height = nextH;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (snap.width && snap.height) ctx.drawImage(snap, 0, 0, cssW, cssH);
  }

  function clearCanvas() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    last = null;
    autoLast = null;
  }

  // One filled stadium per sample gap. Round caps are the same radius as the
  // body, so a slow or sparse finger still lays a solid ribbon. iPad Safari
  // paints each per-move round cap as a fat dot on a hairline.
  function ribbonOn(context, x0, y0, r0, x1, y1, r1, color) {
    r0 = Math.max(0.5, r0);
    r1 = Math.max(0.5, r1);
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    context.fillStyle = 'hsl(' + color.hue + ' ' + color.sat + '% ' + color.light + '%)';
    context.beginPath();
    if (len < 0.01) {
      context.arc(x0, y0, Math.max(r0, r1), 0, Math.PI * 2);
      context.fill();
      return;
    }
    const px = -dy / len, py = dx / len;
    const left = Math.atan2(py, px);
    context.arc(x0, y0, r0, left, left + Math.PI, false);
    context.arc(x1, y1, r1, left + Math.PI, left + Math.PI * 2, false);
    context.closePath();
    context.fill();
  }

  function fillRibbon(x0, y0, r0, x1, y1, r1) {
    ribbonOn(ctx, x0, y0, r0, x1, y1, r1, { hue: hue, sat: sat, light: light });
  }

  function clampNum(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // What this stroke is, measured when the fly reaches it. No brush names.
  function measureStroke(start) {
    const w = Math.max(1, canvas.width / dpr);
    const h = Math.max(1, canvas.height / dpr);
    const m = Math.min(w, h);
    let n = 0, sumR = 0, sumL = 0, length = 0, turn = 0;
    let prev = null, prevAng = null;
    for (let i = start; i < flyPlan.length; i++) {
      const p = flyPlan[i];
      if (i > start && p.lift) break;
      const x = p.nx * w + (p.ox || 0) * m;
      const y = p.ny * h + (p.oy || 0) * m;
      const r = Math.max(0.8, (p.rw || 0) * w + (p.rh || 0) * h + (p.rm || 0) * m);
      if (prev) {
        const dx = x - prev.x, dy = y - prev.y;
        const step = Math.hypot(dx, dy);
        length += step;
        if (step > 0.5) {
          const ang = Math.atan2(dy, dx);
          if (prevAng != null) {
            let d = ang - prevAng;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            turn += Math.abs(d);
          }
          prevAng = ang;
        }
      }
      prev = { x: x, y: y };
      sumR += r;
      sumL += p.light;
      n++;
    }
    return {
      start: start,
      n: n,
      meanR: n ? sumR / n : 8,
      meanL: n ? sumL / n : 50,
      length: length,
      turn: turn
    };
  }

  // A brush that fits the stroke the fly is about to draw. Numbers only.
  function goalBrush(stats) {
    const wide = stats.meanR >= 10;
    const thin = stats.meanR <= 5.5;
    const bright = stats.meanL >= 62;
    const curvy = stats.length > 18 && (stats.turn / Math.max(1, stats.length)) > 0.02;
    return {
      diameter: clampNum(stats.meanR * 2, 2, 64),
      opacity: 1,
      edge: wide ? 0.84 : (bright ? 0.42 : 0.1),
      taper: (thin && curvy) ? 0.74 : (curvy ? 0.3 : 0.04),
      flat: (wide && !bright) ? 0.72 : 0.05,
      core: (bright && !wide) ? 0.86 : (bright ? 0.34 : 0.02),
      jitter: 0
    };
  }

  // A plain ribbon the same width as the real stroke. Later looks move
  // invented brushes toward this so the canvas can become a replica.
  function plainBrush(stats) {
    return {
      diameter: clampNum(Math.round(stats.meanR * 2), 2, 64),
      opacity: 1,
      edge: 0,
      taper: 0,
      flat: 0,
      core: 0,
      jitter: 0,
      phase: 0
    };
  }

  function mixBrush(a, b, k) {
    function m(p) { return a[p] + (b[p] - a[p]) * k; }
    return {
      diameter: Math.max(2, Math.round(m('diameter'))),
      opacity: m('opacity'),
      edge: m('edge'),
      taper: m('taper'),
      flat: m('flat'),
      core: m('core'),
      jitter: m('jitter'),
      phase: 0
    };
  }

  // First look: the fly's own best brush. Each later look moves that brush
  // toward the real stroke until the painting can match.
  function decideBrush(stats) {
    const invented = goalBrush(stats);
    invented.phase = 0;
    if (lookPass <= 0) return invented;
    const k = Math.min(1, lookPass / 5);
    return mixBrush(invented, plainBrush(stats), k);
  }

  function shapeKey(brush) {
    return [
      brush.edge > 0.55 ? 'feather' : 'hard',
      brush.taper > 0.45 ? 'taper' : 'even',
      brush.flat > 0.55 ? 'flat' : 'round',
      brush.core > 0.45 ? 'core' : 'plain'
    ].join('-');
  }

  function describeBrush(brush) {
    const bits = [brush.diameter + 'px'];
    if (brush.flat > 0.55) bits.push('flat');
    else if (brush.edge > 0.55) bits.push('feathered');
    else bits.push('round');
    if (brush.taper > 0.45) bits.push('tapered');
    if (brush.core > 0.45) bits.push('bright middle');
    if (brush.jitter > 0.18) bits.push('uneven');
    if (brush.opacity < 0.75) bits.push('thin paint');
    return bits.join(' ');
  }

  function hideBrushHud() {
    const tag = document.getElementById('brushHud');
    tag.hidden = true;
    tag.textContent = 'The fly has not made a brush yet.';
    const names = [
      'diameter', 'edge', 'taper', 'flat', 'core', 'jitter', 'opacity', 'shape', 'round',
      'firstDiameter', 'firstShape', 'firstEdge', 'firstTaper', 'firstFlat', 'firstCore', 'firstJitter',
      'minDiameter', 'maxDiameter', 'shapeCount'
    ];
    for (let i = 0; i < names.length; i++) delete tag.dataset[names[i]];
  }

  function publishBrush(brush) {
    const tag = document.getElementById('brushHud');
    tag.hidden = false;
    tag.textContent = 'Fly made this brush: ' + describeBrush(brush);
    tag.dataset.diameter = String(brush.diameter);
    tag.dataset.edge = brush.edge.toFixed(3);
    tag.dataset.taper = brush.taper.toFixed(3);
    tag.dataset.flat = brush.flat.toFixed(3);
    tag.dataset.core = brush.core.toFixed(3);
    tag.dataset.jitter = brush.jitter.toFixed(3);
    tag.dataset.opacity = brush.opacity.toFixed(3);
    tag.dataset.shape = shapeKey(brush);
    tag.dataset.round = String(lookPass + 1);
    if (roundFirstBrush) {
      tag.dataset.firstDiameter = String(roundFirstBrush.diameter);
      tag.dataset.firstShape = shapeKey(roundFirstBrush);
      tag.dataset.firstEdge = roundFirstBrush.edge.toFixed(3);
      tag.dataset.firstTaper = roundFirstBrush.taper.toFixed(3);
      tag.dataset.firstFlat = roundFirstBrush.flat.toFixed(3);
      tag.dataset.firstCore = roundFirstBrush.core.toFixed(3);
      tag.dataset.firstJitter = roundFirstBrush.jitter.toFixed(3);
    }
    tag.dataset.minDiameter = String(roundMinD);
    tag.dataset.maxDiameter = String(roundMaxD);
    tag.dataset.shapeCount = String(Object.keys(roundShapeKeys).length);
  }

  function trackRoundBrush(brush) {
    if (!roundFirstBrush) {
      roundFirstBrush = brush;
      roundMinD = brush.diameter;
      roundMaxD = brush.diameter;
    } else {
      if (brush.diameter < roundMinD) roundMinD = brush.diameter;
      if (brush.diameter > roundMaxD) roundMaxD = brush.diameter;
    }
    roundShapeKeys[shapeKey(brush)] = 1;
    publishBrush(brush);
  }

  function setInvent(on) {
    inventOn = !!on;
    btnInvent.classList.toggle('active', inventOn);
    btnInvent.setAttribute('aria-pressed', inventOn ? 'true' : 'false');
    btnInvent.textContent = inventOn ? 'Fly makes brushes: on' : 'Fly makes brushes';
    inventHint.textContent = inventOn
      ? 'On. The fly picks brush size and shape, then keeps fixing them until the painting is a replica.'
      : 'Off. Turn this on and the fly decides brush size and shape, then keeps fixing them until the painting is a replica.';
    try { localStorage.setItem('purpleDrawInventBrushes', inventOn ? '1' : '0'); } catch (_) {}
    if (autoOn) {
      finishStroke();
      autoLast = null;
    }
    if (!inventOn) hideBrushHud();
  }

  function needsBrushLayer(brush) {
    if (brush.opacity < 0.98) return true;
    if (brush.edge > 0.08) return true;
    if (brush.core > 0.12) return true;
    if (brush.taper > 0.08) return true;
    if (brush.flat > 0.55) return true;
    return false;
  }

  function pointRadius(brush, i, n) {
    let scale = 1;
    if (brush.taper > 0.08) {
      const t = n <= 1 ? 0.5 : i / (n - 1);
      const belly = Math.sin(t * Math.PI);
      scale = (1 - brush.taper) + brush.taper * (0.25 + 0.75 * belly);
    }
    if (brush.jitter > 0.02) scale *= 1 + brush.jitter * Math.sin(i * 1.9 + (brush.phase || 0));
    return Math.max(0.7, (brush.diameter / 2) * scale);
  }

  function colorCss(color, satAdd, lightAdd) {
    const s = clampNum(color.sat + (satAdd || 0), 0, 100);
    const l = clampNum(color.light + (lightAdd || 0), 0, 97);
    return 'hsl(' + color.hue + ' ' + s + '% ' + l + '%)';
  }

  function brushLayers(brush, color) {
    const base = colorCss(color, 0, 0);
    const cap = brush.flat > 0.55 ? 0.2 : 1;
    const layers = [];
    if (brush.edge > 0.08) {
      layers.push({
        scale: 1 + brush.edge * 1.35,
        alpha: 0.16 + brush.edge * 0.24,
        color: base,
        cap: cap
      });
    }
    layers.push({ scale: 1, alpha: brush.opacity, color: base, cap: cap });
    if (brush.core > 0.12) {
      layers.push({
        scale: 0.28 + (1 - brush.core) * 0.4,
        alpha: 0.55 + brush.core * 0.45,
        color: colorCss(color, -18, 16 + brush.core * 18),
        cap: 1
      });
    }
    return layers;
  }

  function addStadium(ctx2, x0, y0, r0, x1, y1, r1) {
    r0 = Math.max(0.6, r0);
    r1 = Math.max(0.6, r1);
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    if (len < 0.01) {
      ctx2.moveTo(x0 + Math.max(r0, r1), y0);
      ctx2.arc(x0, y0, Math.max(r0, r1), 0, Math.PI * 2);
      return;
    }
    const px = -dy / len, py = dx / len;
    const left = Math.atan2(py, px);
    ctx2.moveTo(x0 + Math.cos(left) * r0, y0 + Math.sin(left) * r0);
    ctx2.arc(x0, y0, r0, left, left + Math.PI, false);
    ctx2.arc(x1, y1, r1, left + Math.PI, left + Math.PI * 2, false);
    ctx2.closePath();
  }

  function addFlatStrip(ctx2, pts, radiusFn) {
    const left = [];
    const right = [];
    for (let i = 0; i < pts.length; i++) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(pts.length - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      let len = Math.hypot(dx, dy);
      if (len < 0.001) { dx = 1; dy = 0; len = 1; }
      const px = -dy / len, py = dx / len;
      const r = Math.max(0.6, radiusFn(i));
      left.push(pts[i].x + px * r, pts[i].y + py * r);
      right.push(pts[i].x - px * r, pts[i].y - py * r);
    }
    ctx2.moveTo(left[0], left[1]);
    for (let i = 1; i < pts.length; i++) ctx2.lineTo(left[i * 2], left[i * 2 + 1]);
    for (let i = pts.length - 1; i >= 0; i--) ctx2.lineTo(right[i * 2], right[i * 2 + 1]);
    ctx2.closePath();
  }

  function strokeReach(pts) {
    let max = 0;
    for (let i = 1; i < pts.length; i++) {
      max = Math.max(max, Math.hypot(pts[i].x - pts[0].x, pts[i].y - pts[0].y));
    }
    return max;
  }

  // Fills a whole stroke in one pass so soft edges do not stack into dots.
  function fillBrushShape(ctx2, pts, radiusFn, cap) {
    if (!pts.length) return;
    ctx2.beginPath();
    if (pts.length === 1 || strokeReach(pts) < 0.45) {
      const r = Math.max(0.6, radiusFn(0));
      ctx2.moveTo(pts[0].x + r, pts[0].y);
      ctx2.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2);
      ctx2.fill();
      return;
    }
    if (cap < 0.85) addFlatStrip(ctx2, pts, radiusFn);
    else {
      for (let i = 1; i < pts.length; i++) {
        addStadium(ctx2, pts[i - 1].x, pts[i - 1].y, radiusFn(i - 1), pts[i].x, pts[i].y, radiusFn(i));
      }
    }
    ctx2.fill();
  }

  function ensureBrushBuffers() {
    if (!brushLayer) {
      brushLayer = document.createElement('canvas');
      brushSnap = document.createElement('canvas');
    }
    if (brushLayer.width !== canvas.width || brushLayer.height !== canvas.height) {
      brushLayer.width = canvas.width;
      brushLayer.height = canvas.height;
      brushSnap.width = canvas.width;
      brushSnap.height = canvas.height;
    }
  }

  function captureSnap() {
    ensureBrushBuffers();
    const sctx = brushSnap.getContext('2d');
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalAlpha = 1;
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, brushSnap.width, brushSnap.height);
    sctx.drawImage(canvas, 0, 0);
  }

  function discardStroke() {
    strokeOpen = false;
    activePts = [];
    activeBrush = null;
    activeColor = null;
    directCount = 0;
  }

  function renderActiveStroke() {
    if (!strokeOpen || !activeBrush || !activePts.length) return;
    const brush = activeBrush;
    const color = activeColor;
    hue = color.hue;
    sat = color.sat;
    light = color.light;
    if (!needsBrushLayer(brush)) {
      paintDirectNewPoints(brush);
      return;
    }
    ensureBrushBuffers();
    const lctx = brushLayer.getContext('2d');
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalAlpha = 1;
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, brushLayer.width, brushLayer.height);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const layers = brushLayers(brush, color);
    const n = activePts.length;
    for (let k = 0; k < layers.length; k++) {
      const layer = layers[k];
      lctx.globalAlpha = layer.alpha;
      lctx.fillStyle = layer.color;
      fillBrushShape(lctx, activePts, (i) => pointRadius(brush, i, n) * layer.scale, layer.cap);
    }
    lctx.globalAlpha = 1;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(brushSnap, 0, 0);
    ctx.drawImage(brushLayer, 0, 0);
    ctx.restore();
  }

  function paintDirectNewPoints(brush) {
    const pts = activePts;
    const n = pts.length;
    ctx.save();
    ctx.globalAlpha = 1;
    if (directCount === 0) {
      const r = pointRadius(brush, 0, n);
      fillRibbon(pts[0].x, pts[0].y, r, pts[0].x, pts[0].y, r);
      directCount = 1;
    }
    for (let i = directCount; i < n; i++) {
      fillRibbon(
        pts[i - 1].x, pts[i - 1].y, pointRadius(brush, i - 1, n),
        pts[i].x, pts[i].y, pointRadius(brush, i, n)
      );
    }
    directCount = n;
    ctx.restore();
  }

  function finishStroke() {
    if (!strokeOpen) return;
    renderActiveStroke();
    discardStroke();
  }

  function beginStroke(color, brush) {
    finishStroke();
    activeBrush = brush;
    activeColor = { hue: color.hue, sat: color.sat, light: color.light };
    activePts = [];
    directCount = 0;
    strokeOpen = true;
    trackRoundBrush(brush);
    if (needsBrushLayer(brush)) captureSnap();
  }

  function queueFlyPoint(x, y) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    const prev = activePts.length ? activePts[activePts.length - 1] : null;
    if (prev && Math.hypot(x - prev.x, y - prev.y) < 0.12) return;
    activePts.push({ x: x, y: y });
  }

  function drawTo(x, y) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    const w = size;
    if (!last) {
      last = { x, y, w };
      fillRibbon(x, y, w / 2, x, y, w / 2);
      return;
    }
    const dist = Math.hypot(x - last.x, y - last.y);
    if (dist < 0.15 && Math.abs(w - last.w) < 0.25) return;
    fillRibbon(last.x, last.y, last.w / 2, x, y, w / 2);
    last = { x, y, w };
  }

  function localPoint(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  function pointerPoints(e) {
    let list = null;
    try {
      if (typeof e.getCoalescedEvents === 'function') list = e.getCoalescedEvents();
    } catch (_) { list = null; }
    const src = list && list.length ? list : [e];
    const out = [];
    for (const ev of src) {
      if (ev.clientX == null || ev.clientY == null) continue;
      out.push(localPoint(ev.clientX, ev.clientY));
    }
    return out;
  }

  function touchPoint(e, useChanged) {
    const list = (!useChanged && e.touches && e.touches.length) ? e.touches : e.changedTouches;
    if (!list || !list.length) return null;
    let t = null;
    for (let i = 0; i < list.length; i++) {
      if (touchId == null || list[i].identifier === touchId) { t = list[i]; break; }
    }
    if (!t) return null;
    return { id: t.identifier, ...localPoint(t.clientX, t.clientY) };
  }

  function dismissPracticeBanner() {
    if (!practiceDone) return;
    practiceDone = false;
    setPracticeText('');
    hideBrushHud();
  }

  function onPointerDown(e) {
    if (touchDevice && e.pointerType === 'touch') return;
    if (autoOn || starryOn) { e.preventDefault(); return; }
    dismissPracticeBanner();
    if (pointerId !== null || touchId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pointerId = e.pointerId;
    drawing = true;
    last = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    for (const p of pointerPoints(e)) drawTo(p.x, p.y);
  }

  function onPointerMove(e) {
    if (!drawing || e.pointerId !== pointerId) return;
    e.preventDefault();
    for (const p of pointerPoints(e)) drawTo(p.x, p.y);
  }

  function onPointerUp(e) {
    if (pointerId === null || e.pointerId !== pointerId) return;
    if (e.cancelable) e.preventDefault();
    if (drawing) {
      for (const p of pointerPoints(e)) drawTo(p.x, p.y);
    }
    drawing = false;
    pointerId = null;
    last = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  function onTouchDown(e) {
    if (autoOn || starryOn) { e.preventDefault(); return; }
    dismissPracticeBanner();
    if (touchId !== null || pointerId !== null) return;
    e.preventDefault();
    const p = touchPoint(e, false);
    if (!p || Number.isNaN(p.x)) return;
    touchId = p.id;
    drawing = true;
    last = null;
    drawTo(p.x, p.y);
  }

  function onTouchMove(e) {
    if (!drawing || touchId === null) return;
    e.preventDefault();
    const p = touchPoint(e, false);
    if (!p || Number.isNaN(p.x)) return;
    drawTo(p.x, p.y);
  }

  function onTouchUp(e) {
    if (touchId === null) return;
    const p = touchPoint(e, true);
    if (e.cancelable) e.preventDefault();
    if (drawing && p && p.id === touchId && !Number.isNaN(p.x)) drawTo(p.x, p.y);
    drawing = false;
    touchId = null;
    last = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  canvas.addEventListener('touchstart', onTouchDown, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchUp, { passive: false });
  canvas.addEventListener('touchcancel', onTouchUp, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Autopilot paints the fly's best Starry Night, compares the canvas to the
  // real one, says what is wrong, and fixes those parts. The Starry Night
  // button still plays the real painting once, with fixed ribbons.
  function starryScreen(p) {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const m = Math.min(w, h);
    return {
      x: p.nx * w + (p.ox || 0) * m,
      y: p.ny * h + (p.oy || 0) * m,
      r: Math.max(0.8, (p.rw || 0) * w + (p.rh || 0) * h + (p.rm || 0) * m),
      hue: p.hue,
      sat: p.sat,
      light: p.light,
      role: p.role || 'mark'
    };
  }

  function memoryIdentity() {
    return {
      skyWidth: 1, skyHue: 0, skySat: 1, skyLight: 0,
      moonScale: 1, moonDx: 0, moonDy: 0, moonLight: 0, moonSat: 1,
      starScale: 1, starDx: 0, starDy: 0, starLight: 0,
      swirlScale: 1, swirlHue: 0,
      cypressScale: 1, cypressHue: 0, cypressLight: 0,
      mountainLight: 0,
      villageScale: 1, villageDy: 0,
      windowLight: 0, windowSat: 1
    };
  }

  // The fly's best memory of the painting, before it looks at the real one.
  // Strokes are clean. The misses are the ones a look can name and fix.
  function freshMemory() {
    return {
      skyWidth: 0.42, skyHue: 42, skySat: 0.55, skyLight: 14,
      moonScale: 0.5, moonDx: -0.08, moonDy: 0.05, moonLight: 20, moonSat: 0.5,
      starScale: 0.48, starDx: 0.045, starDy: 0.035, starLight: -14,
      swirlScale: 0.6, swirlHue: 20,
      cypressScale: 0.46, cypressHue: 42, cypressLight: 10,
      mountainLight: 20,
      villageScale: 0.8, villageDy: 0.02,
      windowLight: -34, windowSat: 0.4
    };
  }

  function applyMemory(plan, mem) {
    const out = [];
    for (let i = 0; i < plan.length; i++) {
      const p = plan[i];
      const q = {
        nx: p.nx, ny: p.ny, ox: p.ox || 0, oy: p.oy || 0,
        rw: p.rw || 0, rh: p.rh || 0, rm: p.rm || 0,
        hue: p.hue, sat: p.sat, light: p.light,
        lift: p.lift, role: p.role || 'mark'
      };
      const role = q.role;
      if (role === 'sky') {
        q.rw *= mem.skyWidth;
        q.rh *= mem.skyWidth;
        q.rm *= mem.skyWidth;
        q.hue = (q.hue + mem.skyHue + 360) % 360;
        q.sat = clampNum(q.sat * mem.skySat, 0, 100);
        q.light = clampNum(q.light + mem.skyLight, 0, 96);
      } else if (role === 'swirl' || role === 'highlight') {
        const cy = 0.28;
        q.ny = cy + (q.ny - cy) * mem.swirlScale;
        q.ox *= mem.swirlScale;
        q.oy *= mem.swirlScale;
        q.rm *= mem.swirlScale;
        q.hue = (q.hue + mem.swirlHue + 360) % 360;
      } else if (role === 'moon') {
        q.ox *= mem.moonScale;
        q.oy *= mem.moonScale;
        q.rm *= mem.moonScale;
        q.rw *= mem.moonScale;
        q.nx += mem.moonDx;
        q.ny += mem.moonDy;
        q.light = clampNum(q.light + mem.moonLight, 0, 96);
        q.sat = clampNum(q.sat * mem.moonSat, 0, 100);
      } else if (role === 'star' || role === 'starSpin' || role === 'starCore') {
        q.ox *= mem.starScale;
        q.oy *= mem.starScale;
        q.rm *= mem.starScale;
        q.rw *= mem.starScale;
        q.nx += mem.starDx;
        q.ny += mem.starDy;
        q.light = clampNum(q.light + mem.starLight, 0, 96);
      } else if (role === 'mountain') {
        q.light = clampNum(q.light + mem.mountainLight, 0, 96);
      } else if (role === 'flame' || role === 'vein' || (role === 'outline' && q.nx < 0.28)) {
        const cx = 0.145;
        q.nx = cx + (q.nx - cx) * mem.cypressScale;
        q.rw *= mem.cypressScale;
        q.rm *= mem.cypressScale;
        q.hue = (q.hue + mem.cypressHue + 360) % 360;
        q.light = clampNum(q.light + mem.cypressLight, 0, 96);
      } else if (role === 'window') {
        q.light = clampNum(q.light + mem.windowLight, 0, 96);
        q.sat = clampNum(q.sat * mem.windowSat, 0, 100);
        q.ny += mem.villageDy;
        q.nx = 0.62 + (q.nx - 0.62) * mem.villageScale;
      } else if (role === 'house' || role === 'roof' || role === 'steeple' || role === 'outline') {
        q.ny += mem.villageDy;
        q.nx = 0.62 + (q.nx - 0.62) * mem.villageScale;
      }
      out.push(q);
    }
    return out;
  }

  function easeMem(key, amount) {
    flyMemory[key] = flyMemory[key] + (memoryIdentity()[key] - flyMemory[key]) * amount;
  }

  function applyFixes(issues) {
    const seen = Object.create(null);
    for (let i = 0; i < issues.length; i++) {
      const fix = issues[i].fix;
      if (seen[fix]) continue;
      seen[fix] = 1;
      if (fix === 'sky') easeMem('skyWidth', FIX_AMOUNT);
      else if (fix === 'skyColor') { easeMem('skyHue', FIX_AMOUNT); easeMem('skySat', FIX_AMOUNT); }
      else if (fix === 'skyLight') easeMem('skyLight', FIX_AMOUNT);
      else if (fix === 'moonSize') {
        easeMem('moonScale', FIX_AMOUNT);
        easeMem('moonLight', FIX_AMOUNT);
        easeMem('moonSat', FIX_AMOUNT);
      }
      else if (fix === 'moonPlace') { easeMem('moonDx', FIX_AMOUNT); easeMem('moonDy', FIX_AMOUNT); }
      else if (fix === 'moonPale') { easeMem('moonLight', FIX_AMOUNT); easeMem('moonSat', FIX_AMOUNT); }
      else if (fix === 'stars') {
        easeMem('starScale', FIX_AMOUNT);
        easeMem('starLight', FIX_AMOUNT);
        easeMem('starDx', FIX_AMOUNT);
        easeMem('starDy', FIX_AMOUNT);
      } else if (fix === 'tree') easeMem('cypressScale', FIX_AMOUNT);
      else if (fix === 'treeColor') { easeMem('cypressHue', FIX_AMOUNT); easeMem('cypressLight', FIX_AMOUNT); }
      else if (fix === 'windows') {
        easeMem('windowLight', FIX_AMOUNT);
        easeMem('windowSat', FIX_AMOUNT);
        easeMem('villageScale', FIX_AMOUNT);
        easeMem('villageDy', FIX_AMOUNT);
      } else if (fix === 'hills') easeMem('mountainLight', FIX_AMOUNT);
      else if (fix === 'swirls') { easeMem('swirlScale', FIX_AMOUNT); easeMem('swirlHue', FIX_AMOUNT); }
      else if (fix === 'all') {
        const goal = memoryIdentity();
        for (const key in goal) easeMem(key, FIX_AMOUNT);
      }
    }
    // Keep pulling every part closer until the canvas is a replica,
    // including parts this look did not name.
    if (lastDistance > REPLICA_DISTANCE) {
      const goal = memoryIdentity();
      const nudge = lastDistance > 40 ? 0.2 : 0.45;
      for (const key in goal) easeMem(key, nudge);
    }
  }

  function paintPlanSync(target, plan) {
    const tctx = target.getContext('2d');
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0, 0, target.width, target.height);
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let prev = null;
    for (let i = 0; i < plan.length; i++) {
      const p = plan[i];
      const s = starryScreen(p);
      const col = { hue: s.hue, sat: s.sat, light: s.light };
      if (p.lift || !prev) ribbonOn(tctx, s.x, s.y, s.r, s.x, s.y, s.r, col);
      else ribbonOn(tctx, prev.x, prev.y, prev.r, s.x, s.y, s.r, col);
      prev = s;
    }
  }

  function ensureRefCanvas() {
    const key = canvas.width + 'x' + canvas.height + '@' + dpr;
    if (refCanvas && refKey === key) return refCanvas;
    refCanvas = document.createElement('canvas');
    refCanvas.width = canvas.width;
    refCanvas.height = canvas.height;
    refKey = key;
    paintPlanSync(refCanvas, buildStarryPlan());
    return refCanvas;
  }

  function grab(source) {
    const sctx = source.getContext('2d');
    const w = source.width;
    const h = source.height;
    return { w: w, h: h, data: sctx.getImageData(0, 0, w, h).data };
  }

  function isYellow(R, G, B) {
    return R > 165 && G > 115 && B < 160 && R > B + 35 && G > B + 8;
  }

  function rgbHue(R, G, B) {
    const r = R / 255, g = G / 255, b = B / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    if (max - min < 0.03) return -1;
    const d = max - min;
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
    return h;
  }

  function meanHue(img, nx0, ny0, nx1, ny1, pred) {
    const x0 = Math.max(0, Math.floor(nx0 * img.w));
    const x1 = Math.min(img.w, Math.ceil(nx1 * img.w));
    const y0 = Math.max(0, Math.floor(ny0 * img.h));
    const y1 = Math.min(img.h, Math.ceil(ny1 * img.h));
    const step = Math.max(1, Math.floor(Math.min(img.w, img.h) / 160));
    let s = 0, c = 0, n = 0;
    for (let y = y0; y < y1; y += step) {
      const row = y * img.w;
      for (let x = x0; x < x1; x += step) {
        const i = (row + x) * 4;
        const R = img.data[i], G = img.data[i + 1], B = img.data[i + 2];
        if (pred && !pred(R, G, B)) continue;
        const h = rgbHue(R, G, B);
        if (h < 0) continue;
        const rad = h * Math.PI / 180;
        s += Math.sin(rad);
        c += Math.cos(rad);
        n++;
      }
    }
    if (!n) return null;
    return (Math.atan2(s, c) * 180 / Math.PI + 360) % 360;
  }

  function treeMass(img) {
    const x1 = Math.floor(img.w * 0.30);
    const y0 = Math.floor(img.h * 0.18);
    const y1 = Math.floor(img.h * 0.96);
    const step = 2;
    let hits = 0, n = 0, minx = img.w, maxx = 0;
    for (let y = y0; y < y1; y += step) {
      const row = y * img.w;
      for (let x = 0; x < x1; x += step) {
        n++;
        const i = (row + x) * 4;
        const R = img.data[i], G = img.data[i + 1], B = img.data[i + 2];
        const h = rgbHue(R, G, B);
        const L = (R + G + B) / 3;
        if (h >= 95 && h < 215 && L < 110) {
          hits++;
          if (x < minx) minx = x;
          if (x > maxx) maxx = x;
        }
      }
    }
    return {
      coverage: n ? hits / n : 0,
      w: hits ? (maxx - minx) / img.w : 0
    };
  }

  function isBrightYellow(R, G, B) {
    return R > 205 && G > 165 && B < 175 && (R + G) > 390;
  }

  function scan(img, nx0, ny0, nx1, ny1, pred, stepOverride) {
    const x0 = Math.max(0, Math.floor(nx0 * img.w));
    const x1 = Math.min(img.w, Math.ceil(nx1 * img.w));
    const y0 = Math.max(0, Math.floor(ny0 * img.h));
    const y1 = Math.min(img.h, Math.ceil(ny1 * img.h));
    const step = stepOverride || Math.max(1, Math.floor(Math.min(img.w, img.h) / 170));
    let n = 0, cov = 0, cr = 0, cg = 0, cb = 0;
    let hits = 0, pr = 0, pg = 0, pb = 0, hx = 0, hy = 0;
    let minx = img.w, miny = img.h, maxx = 0, maxy = 0;
    for (let y = y0; y < y1; y += step) {
      const row = y * img.w;
      for (let x = x0; x < x1; x += step) {
        const i = (row + x) * 4;
        const R = img.data[i], G = img.data[i + 1], B = img.data[i + 2];
        n++;
        const white = R > 242 && G > 242 && B > 242;
        if (!white) { cov++; cr += R; cg += G; cb += B; }
        if (pred && pred(R, G, B)) {
          hits++;
          pr += R; pg += G; pb += B;
          hx += x; hy += y;
          if (x < minx) minx = x;
          if (y < miny) miny = y;
          if (x > maxx) maxx = x;
          if (y > maxy) maxy = y;
        }
      }
    }
    return {
      n: n,
      coverage: n ? cov / n : 0,
      cr: cov ? cr / cov : 255,
      cg: cov ? cg / cov : 255,
      cb: cov ? cb / cov : 255,
      hits: hits,
      pr: hits ? pr / hits : 0,
      pg: hits ? pg / hits : 0,
      pb: hits ? pb / hits : 0,
      cx: hits ? (hx / hits) / img.w : null,
      cy: hits ? (hy / hits) / img.h : null,
      bw: hits ? (maxx - minx) / img.w : 0,
      bh: hits ? (maxy - miny) / img.h : 0
    };
  }

  function lookAtPainting() {
    const fly = grab(canvas);
    const ref = grab(ensureRefCanvas());
    const issues = [];
    const skyF = scan(fly, 0.32, 0.0, 0.98, 0.16);
    const skyR = scan(ref, 0.32, 0.0, 0.98, 0.16);
    if (skyF.coverage < skyR.coverage - 0.06) {
      issues.push({
        id: 'skyGaps',
        severity: skyR.coverage - skyF.coverage,
        say: inventOn ? 'The sky brush is too thin, so white shows through.' : 'The sky has white gaps.',
        fix: 'sky',
        label: 'the sky'
      });
    }
    function skyPixel(R, G, B) {
      if (R > 242 && G > 242 && B > 242) return false;
      if (isYellow(R, G, B)) return false;
      return B > R + 8 && B > 40;
    }
    const skyHueF = meanHue(fly, 0.32, 0.0, 0.75, 0.2, skyPixel);
    const skyHueR = meanHue(ref, 0.32, 0.0, 0.75, 0.2, skyPixel);
    let skyHueGap = 0;
    if (skyHueF != null && skyHueR != null) {
      skyHueGap = skyHueF - skyHueR;
      if (skyHueGap > 180) skyHueGap -= 360;
      if (skyHueGap < -180) skyHueGap += 360;
      if (skyHueGap > 10) {
        issues.push({
          id: 'skyColor',
          severity: skyHueGap / 40,
          say: 'The sky is too purple.',
          fix: 'skyColor',
          label: 'the sky color'
        });
      }
    }
    const skyLumF = (skyF.cr + skyF.cg + skyF.cb) / 3;
    const skyLumR = (skyR.cr + skyR.cg + skyR.cb) / 3;
    if (skyF.coverage > 0.4 && skyLumF > skyLumR + 22) {
      issues.push({
        id: 'skyLight',
        severity: (skyLumF - skyLumR) / 50,
        say: 'The sky is too light.',
        fix: 'skyLight',
        label: 'the sky'
      });
    }

    const moonF = scan(fly, 0.68, 0.02, 0.98, 0.30, isYellow, 2);
    const moonR = scan(ref, 0.68, 0.02, 0.98, 0.30, isYellow, 2);
    if (moonR.hits > 12 && moonF.hits < moonR.hits * 0.72) {
      issues.push({
        id: 'moonSize',
        severity: 1 - moonF.hits / moonR.hits,
        say: inventOn ? 'The moon brush is too small.' : 'The moon is too small.',
        fix: 'moonSize',
        label: 'the moon'
      });
    }
    if (moonF.cx != null && moonR.cx != null) {
      const dist = Math.hypot(moonF.cx - moonR.cx, moonF.cy - moonR.cy);
      if (dist > 0.028) {
        issues.push({
          id: 'moonPlace',
          severity: dist * 6,
          say: 'The moon is in the wrong spot.',
          fix: 'moonPlace',
          label: 'the moon'
        });
      }
    }
    if (moonF.hits > 6 && moonR.hits > 6 && (moonF.pr - moonF.pb) < (moonR.pr - moonR.pb) * 0.8) {
      issues.push({
        id: 'moonPale',
        severity: 0.62,
        say: 'The moon is too pale.',
        fix: 'moonPale',
        label: 'the moon'
      });
    }

    const starF = scan(fly, 0.16, 0.02, 0.70, 0.56, isYellow, 2);
    const starR = scan(ref, 0.16, 0.02, 0.70, 0.56, isYellow, 2);
    if (starR.hits > 10 && starF.hits < starR.hits * 0.68) {
      issues.push({
        id: 'stars',
        severity: 1 - starF.hits / starR.hits,
        say: inventOn ? 'The star brushes are too small and dim.' : 'The stars are too small and dim.',
        fix: 'stars',
        label: 'the stars'
      });
    }

    const treeF = treeMass(fly);
    const treeR = treeMass(ref);
    if (treeR.coverage > 0.05 && treeF.coverage < treeR.coverage * 0.72) {
      issues.push({
        id: 'treeSize',
        severity: 1 - treeF.coverage / treeR.coverage,
        say: inventOn ? 'The tree brush is too thin.' : 'The big tree is too skinny.',
        fix: 'tree',
        label: 'the big tree'
      });
    }
    const trunkF = scan(fly, 0.08, 0.4, 0.22, 0.92, null, 2);
    const trunkR = scan(ref, 0.08, 0.4, 0.22, 0.92, null, 2);
    if (trunkF.coverage > 0.15 && (trunkF.cb - trunkF.cg) > (trunkR.cb - trunkR.cg) + 8) {
      issues.push({
        id: 'treeColor',
        severity: 0.55,
        say: 'The big tree is the wrong color.',
        fix: 'treeColor',
        label: 'the big tree'
      });
    }

    const winF = scan(fly, 0.30, 0.74, 0.98, 0.99, isBrightYellow, 1);
    const winR = scan(ref, 0.30, 0.74, 0.98, 0.99, isBrightYellow, 1);
    if (winR.hits > 4 && winF.hits < winR.hits * 0.5) {
      issues.push({
        id: 'windows',
        severity: 0.7,
        say: 'The windows need more glow.',
        fix: 'windows',
        label: 'the windows'
      });
    }

    const hillF = scan(fly, 0.28, 0.58, 0.98, 0.80, null, 2);
    const hillR = scan(ref, 0.28, 0.58, 0.98, 0.80, null, 2);
    const hillLumF = (hillF.cr + hillF.cg + hillF.cb) / 3;
    const hillLumR = (hillR.cr + hillR.cg + hillR.cb) / 3;
    if (hillLumF > hillLumR + 16) {
      issues.push({
        id: 'hills',
        severity: (hillLumF - hillLumR) / 36,
        say: 'The hills are too pale.',
        fix: 'hills',
        label: 'the hills'
      });
    }

    function ringSpread(img, cx, cy, rad) {
      const m = Math.min(img.w, img.h);
      const vals = [];
      for (let i = 0; i < 28; i++) {
        const a = (i / 28) * Math.PI * 2;
        const x = Math.max(0, Math.min(img.w - 1, Math.round((cx + Math.cos(a) * rad * m / img.w) * img.w)));
        const y = Math.max(0, Math.min(img.h - 1, Math.round((cy + Math.sin(a) * rad * m / img.h) * img.h)));
        const p = (y * img.w + x) * 4;
        vals.push((img.data[p] + img.data[p + 1] + img.data[p + 2]) / 3);
      }
      let mean = 0;
      for (let i = 0; i < vals.length; i++) mean += vals[i];
      mean /= vals.length;
      let v = 0;
      for (let i = 0; i < vals.length; i++) v += (vals[i] - mean) * (vals[i] - mean);
      return Math.sqrt(v / vals.length);
    }
    const swF = ringSpread(fly, 0.42, 0.26, 0.15);
    const swR = ringSpread(ref, 0.42, 0.26, 0.15);
    const swDist = swR - swF;
    if (swR > 8 && swF < swR * 0.72) {
      issues.push({
        id: 'swirls',
        severity: (swR - swF) / swR,
        say: 'The swirls are the wrong shape.',
        fix: 'swirls',
        label: 'the swirls'
      });
    }

    issues.sort(function (a, b) { return b.severity - a.severity; });
    let diff = 0, samples = 0;
    const step = Math.max(2, Math.floor(Math.min(fly.w, fly.h) / 70));
    for (let y = 0; y < fly.h; y += step) {
      for (let x = 0; x < fly.w; x += step) {
        const i = (y * fly.w + x) * 4;
        const j = (y * ref.w + x) * 4;
        diff += Math.abs(fly.data[i] - ref.data[j]) + Math.abs(fly.data[i + 1] - ref.data[j + 1]) + Math.abs(fly.data[i + 2] - ref.data[j + 2]);
        samples++;
      }
    }
    lastDistance = samples ? diff / samples : 0;
    lastStats = [
      'sky ' + skyF.coverage.toFixed(2) + '/' + skyR.coverage.toFixed(2),
      'hue ' + (skyHueGap).toFixed(0),
      'moon ' + moonF.hits + '/' + moonR.hits,
      'pale ' + Math.round(moonF.pr - moonF.pb) + '/' + Math.round(moonR.pr - moonR.pb),
      'sw ' + swF.toFixed(1) + '/' + swR.toFixed(1),
      'stars ' + starF.hits + '/' + starR.hits,
      'tree ' + treeF.coverage.toFixed(2) + '/' + treeR.coverage.toFixed(2),
      'win ' + winF.hits + '/' + winR.hits,
      'dist ' + lastDistance.toFixed(1)
    ].join(' ');
    if (inventOn) {
      for (let i = issues.length - 1; i >= 0; i--) {
        if (!issueStillReal(issues[i])) issues.splice(i, 1);
      }
    }
    // Named notes can go quiet while the canvas is still visibly off.
    // Keep looking until the pixels are basically the real painting.
    if (lastDistance > REPLICA_DISTANCE) {
      let named = false;
      for (let i = 0; i < issues.length; i++) if (issues[i].fix !== 'all') named = true;
      if (!named) {
        issues.push({
          id: 'replica',
          severity: Math.min(1, lastDistance / 24),
          say: 'It is not a replica of the real Starry Night yet.',
          fix: 'all',
          label: 'the whole painting'
        });
      }
    }
    return issues;
  }

  const FIX_TOL = {
    skyWidth: 0.06, skyHue: 4, skySat: 0.06, skyLight: 3,
    moonScale: 0.06, moonDx: 0.015, moonDy: 0.015, moonLight: 3, moonSat: 0.06,
    starScale: 0.06, starDx: 0.015, starDy: 0.015, starLight: 3,
    swirlScale: 0.06, swirlHue: 4,
    cypressScale: 0.06, cypressHue: 4, cypressLight: 3,
    mountainLight: 3,
    villageScale: 0.06, villageDy: 0.012,
    windowLight: 4, windowSat: 0.08
  };

  const FIX_KEYS = {
    sky: ['skyWidth'],
    skyColor: ['skyHue', 'skySat'],
    skyLight: ['skyLight'],
    moonSize: ['moonScale'],
    moonPlace: ['moonDx', 'moonDy'],
    moonPale: ['moonLight', 'moonSat'],
    stars: ['starScale', 'starLight', 'starDx', 'starDy'],
    tree: ['cypressScale'],
    treeColor: ['cypressHue', 'cypressLight'],
    windows: ['windowLight', 'windowSat', 'villageScale', 'villageDy'],
    hills: ['mountainLight'],
    swirls: ['swirlScale', 'swirlHue']
  };

  function keyClose(key) {
    if (!flyMemory) return false;
    return Math.abs(flyMemory[key] - memoryIdentity()[key]) <= FIX_TOL[key];
  }

  function planMatches() {
    const goal = memoryIdentity();
    for (const key in goal) if (!keyClose(key)) return false;
    return true;
  }

  // Brush texture does not match the real ribbons pixel for pixel. Once the
  // plan for that part is already corrected, stop calling the brush a mistake.
  function issueStillReal(issue) {
    const keys = FIX_KEYS[issue.fix];
    if (!keys) return true;
    for (let i = 0; i < keys.length; i++) if (!keyClose(keys[i])) return true;
    return false;
  }

  function critiqueSentence(issues) {
    const says = [];
    const seen = Object.create(null);
    for (let i = 0; i < issues.length && says.length < 2; i++) {
      if (seen[issues[i].say]) continue;
      seen[issues[i].say] = 1;
      says.push(issues[i].say.replace(/\.$/, ''));
    }
    if (!says.length) return '';
    return says.join('. ') + '.';
  }

  function fixingSentence(issues) {
    const labels = [];
    const seen = Object.create(null);
    for (let i = 0; i < issues.length && labels.length < 3; i++) {
      if (seen[issues[i].label]) continue;
      seen[issues[i].label] = 1;
      labels.push(issues[i].label);
    }
    if (!labels.length) return 'The fly is checking the real Starry Night.';
    if (labels.length === 1) return 'Fixing ' + labels[0] + '.';
    if (labels.length === 2) return 'Fixing ' + labels[0] + ' and ' + labels[1] + '.';
    return 'Fixing ' + labels[0] + ', ' + labels[1] + ', and ' + labels[2] + '.';
  }

  function setPracticeText(text) {
    const note = document.getElementById('practiceNote');
    const next = text || PRACTICE_HINT;
    if (note.textContent !== next) note.textContent = next;
    if (text) {
      note.dataset.pass = String(lookPass + 1);
      note.dataset.phase = lookPhase;
      note.dataset.critique = critiqueText;
      note.dataset.issues = String(lastIssues.length);
      note.dataset.issueIds = lastIssues.map(function (item) { return item.id; }).join(' ');
      if (lastDistance != null) note.dataset.distance = lastDistance.toFixed(1);
      if (lastStats) note.dataset.stats = lastStats;
    } else {
      delete note.dataset.pass;
      delete note.dataset.phase;
      delete note.dataset.critique;
      delete note.dataset.issues;
      delete note.dataset.issueIds;
      delete note.dataset.distance;
      delete note.dataset.stats;
    }
  }

  function paintFly(x, y, r, color) {
    hue = color.hue;
    sat = color.sat;
    light = color.light;
    if (!autoLast) fillRibbon(x, y, r, x, y, r);
    else fillRibbon(autoLast.x, autoLast.y, autoLast.r, x, y, r);
    autoLast = { x: x, y: y, r: r };
  }

  function flyTowardRibbon(target) {
    paintFly(target.x, target.y, target.r, target);
  }

  function flyTowardBrush(target) {
    queueFlyPoint(target.x, target.y);
    autoLast = { x: target.x, y: target.y };
  }

  function beginPaintPass() {
    discardStroke();
    roundFirstBrush = null;
    roundMinD = 0;
    roundMaxD = 0;
    roundShapeKeys = Object.create(null);
    critiquePauseUntil = 0;
    clearCanvas();
    flyPlan = applyMemory(buildStarryPlan(), flyMemory);
    flyIdx = 0;
    flyPhase = 0;
    flyLastTs = 0;
    autoLast = null;
    lookPhase = 'paint';
    if (lookPass === 0) {
      critiqueText = '';
      fixingText = '';
      setPracticeText('Best try. The fly is painting Starry Night.');
    } else {
      setPracticeText(fixingText || 'Doing better. Still not a replica.');
    }
    if (inventOn) {
      const tag = document.getElementById('brushHud');
      tag.hidden = false;
      tag.textContent = lookPass === 0 ? 'The fly is making brushes.' : 'The fly is fixing brushes.';
    }
  }

  function finishPaintPass(now) {
    finishStroke();
    const issues = lookAtPainting();
    lastIssues = issues;
    const replica = lastDistance != null && lastDistance <= REPLICA_DISTANCE;
    if (replica || lookPass >= MAX_LOOKS - 1) {
      lookPhase = 'done';
      critiqueText = critiqueSentence(issues);
      const line = replica
        ? 'Basically a replica. This one looks just like the real Starry Night.'
        : 'The fly kept doing better. This is as close as this one got.';
      practiceDone = true;
      critiquePauseUntil = 0;
      setPracticeText(line);
      const note = document.getElementById('practiceNote');
      note.dataset.replica = replica ? 'yes' : 'no';
      setAuto(false, { finished: true });
      return;
    }
    lookPhase = 'critique';
    critiqueText = critiqueSentence(issues);
    fixingText = fixingSentence(issues);
    setPracticeText(critiqueText + ' ' + fixingText);
    critiquePauseUntil = now + LOOK_PAUSE;
  }

  function openInventedStroke(target, startIdx) {
    const stats = measureStroke(startIdx);
    beginStroke(target, decideBrush(stats));
  }

  function stepFly(ts) {
    if (!autoOn) return;
    const now = ts || performance.now();
    if (critiquePauseUntil) {
      if (now < critiquePauseUntil) return;
      critiquePauseUntil = 0;
      applyFixes(lastIssues);
      lookPass += 1;
      beginPaintPass();
    }
    if (!flyPlan.length) { setAuto(false); return; }
    let dt = flyLastTs ? now - flyLastTs : 16;
    flyLastTs = now;
    if (dt < 0) dt = 0;
    if (dt > 48) dt = 48;
    let n = Math.round(dt * flyPlan.length / PAINT_BUDGET);
    if (n < 1) n = 1;
    const cap = fastPace ? 240 : 48;
    if (n > cap) n = cap;
    while (n > 0 && flyIdx < flyPlan.length) {
      const raw = flyPlan[flyIdx++];
      const target = starryScreen(raw);
      if (inventOn) {
        if (raw.lift || !strokeOpen) {
          if (strokeOpen) finishStroke();
          autoLast = null;
          openInventedStroke(target, flyIdx - 1);
        }
        flyTowardBrush(target);
      } else {
        if (raw.lift) autoLast = null;
        flyTowardRibbon(target);
      }
      n--;
    }
    if (flyIdx >= flyPlan.length) finishPaintPass(now);
    else if (inventOn) {
      renderActiveStroke();
      updateColorUI();
    } else updateColorUI();
  }

  // Stylized Starry Night, drawn with the same filled ribbons as a finger.
  // nx/ny cover the canvas. ox/oy/rm are fractions of the short side so the
  // moon, stars, and swirls stay round on a phone or a wide window.
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const fastPace = /(?:\?|&)pace=fast(?:&|$)/.test(location.search);
  const STARRY_MS = fastPace ? 500 : (reduceMotion ? 700 : 12000);
  const LOOK_PAUSE = fastPace ? 900 : (reduceMotion ? 600 : 2600);
  const PAINT_BUDGET = fastPace ? 700 : (reduceMotion ? 900 : 11000);

  function buildStarryPlan() {
    const plan = [];
    let seed = 42;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function addStroke(pts, st) {
      const hueV = ((st.hue % 360) + 360) % 360;
      const satV = Math.max(0, Math.min(100, st.sat));
      const lightV = Math.max(0, Math.min(96, st.light));
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        plan.push({
          nx: p.nx, ny: p.ny, ox: p.ox || 0, oy: p.oy || 0,
          rw: st.rw || 0, rh: st.rh || 0, rm: st.rm || 0,
          hue: hueV, sat: satV, light: lightV,
          lift: i === 0,
          role: st.role || 'mark'
        });
      }
    }
    function seg(x0, y0, x1, y1, st) {
      addStroke([{ nx: x0, ny: y0 }, { nx: x1, ny: y1 }], st);
    }
    function addRoll(x0, x1, y, amp, freq, phase, steps, st) {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = x0 + (x1 - x0) * t;
        const yy = y + Math.sin(t * Math.PI * 2 * freq + phase) * amp;
        pts.push({ nx: x, ny: yy });
      }
      addStroke(pts, st);
    }
    function spiral(cx, cy, r0, r1, turns, steps, st) {
      const pts = [];
      const spin = turns < 0 ? -1 : 1;
      const nTurns = Math.abs(turns);
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = spin * t * nTurns * Math.PI * 2 - Math.PI / 2;
        const rad = r0 + (r1 - r0) * t;
        pts.push({ nx: cx, ny: cy, ox: Math.cos(a) * rad, oy: Math.sin(a) * rad });
      }
      addStroke(pts, st);
    }
    function arc(cx, cy, rad, a0, a1, steps, st) {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const a = a0 + (a1 - a0) * (i / steps);
        pts.push({ nx: cx, ny: cy, ox: Math.cos(a) * rad, oy: Math.sin(a) * rad });
      }
      addStroke(pts, st);
    }
    function ring(cx, cy, rad, steps, st) {
      arc(cx, cy, rad, 0, Math.PI * 2, steps, st);
    }

    const rows = 20;
    const y0 = -0.03;
    const y1 = 0.94;
    const step = (y1 - y0) / (rows - 1);
    for (let row = 0; row < rows; row++) {
      const t = row / (rows - 1);
      const y = y0 + step * row;
      const pts = [];
      const n = 22;
      for (let i = 0; i <= n; i++) {
        const x = -0.05 + 1.1 * (i / n);
        const yy = y + Math.sin(x * 5.2 + row * 0.85) * 0.012 + (rnd() - 0.5) * 0.004;
        pts.push({ nx: x, ny: yy });
      }
      addStroke(pts, {
        rh: step * 0.9,
        hue: 228 + Math.sin(row * 1.17) * 12,
        sat: 72 + (row % 3) * 6,
        light: 14 + t * 8 + (row % 4) * 2,
        role: 'sky'
      });
    }

    addRoll(-0.02, 1.02, 0.16, 0.04, 1.15, 0.4, 42, { rh: 0.02, hue: 208, sat: 58, light: 58, role: 'swirl' });
    addRoll(-0.02, 1.02, 0.30, 0.048, 0.95, 1.7, 44, { rh: 0.022, hue: 222, sat: 76, light: 40, role: 'swirl' });
    addRoll(0.0, 1.0, 0.46, 0.036, 1.25, 0.8, 40, { rh: 0.018, hue: 198, sat: 50, light: 54, role: 'swirl' });
    addRoll(0.12, 0.72, 0.12, 0.018, 1.0, 0.2, 28, { rh: 0.01, rm: 0.006, hue: 50, sat: 42, light: 82, role: 'highlight' });

    spiral(0.42, 0.26, 0.02, 0.19, 1.7, 78, { rm: 0.03, hue: 212, sat: 72, light: 50, role: 'swirl' });
    spiral(0.42, 0.26, 0.015, 0.11, -1.35, 52, { rm: 0.016, hue: 50, sat: 38, light: 84, role: 'swirl' });
    spiral(0.67, 0.20, 0.015, 0.12, -1.45, 60, { rm: 0.024, hue: 224, sat: 68, light: 46, role: 'swirl' });
    spiral(0.40, 0.50, 0.012, 0.10, 1.2, 48, { rm: 0.02, hue: 206, sat: 60, light: 48, role: 'swirl' });
    arc(0.84, 0.145, 0.115, 0.2, 5.6, 32, { rm: 0.016, hue: 206, sat: 48, light: 66, role: 'swirl' });

    const peakX = 0.62, peakY = 0.60, baseY = 0.84, left = 0.20, right = 1.0;
    const mRows = 11;
    for (let i = 0; i <= mRows; i++) {
      const t = i / mRows;
      const y = peakY + (baseY - peakY) * t;
      seg(peakX - (peakX - left) * t, y, peakX + (right - peakX) * t, y, {
        rh: (baseY - peakY) / mRows * 0.85,
        hue: 226, sat: 55, light: 28 - t * 8,
        role: 'mountain'
      });
    }

    ring(0.835, 0.15, 0.10, 28, { rm: 0.02, hue: 46, sat: 55, light: 70, role: 'moon' });
    arc(0.835, 0.15, 0.072, -2.35, 2.05, 32, { rm: 0.032, hue: 44, sat: 88, light: 66, role: 'moon' });
    arc(0.835, 0.15, 0.058, -2.15, 1.85, 24, { rm: 0.016, hue: 52, sat: 30, light: 92, role: 'moon' });

    const stars = [
      [0.22, 0.09, 0.042, 1],
      [0.34, 0.17, 0.058, -1],
      [0.50, 0.10, 0.034, 1],
      [0.57, 0.24, 0.062, -1],
      [0.70, 0.11, 0.032, 1],
      [0.91, 0.30, 0.044, -1],
      [0.40, 0.33, 0.04, 1],
      [0.64, 0.37, 0.046, -1],
      [0.30, 0.45, 0.028, 1],
      [0.78, 0.44, 0.032, -1],
      [0.48, 0.49, 0.026, 1]
    ];
    for (let s = 0; s < stars.length; s++) {
      const cx = stars[s][0], cy = stars[s][1], scale = stars[s][2], spin = stars[s][3];
      ring(cx, cy, scale * 1.22, 24, { rm: scale * 0.36, hue: 48, sat: 58, light: 74, role: 'star' });
      spiral(cx, cy, scale * 0.08, scale * 1.02, 1.3 * spin, 30, { rm: scale * 0.24, hue: 46, sat: 96, light: 60, role: 'starSpin' });
      ring(cx, cy, scale * 0.28, 12, { rm: scale * 0.2, hue: 52, sat: 22, light: 93, role: 'starCore' });
    }

    for (let b = 0; b < 6; b++) {
      addRoll(-0.04, 1.04, 0.73 + b * 0.048, 0.018, 1.1 + b * 0.12, b * 0.9, 26, {
        rh: 0.04,
        hue: 224,
        sat: 42 - b * 2,
        light: 16 - b,
        role: 'ground'
      });
    }

    function addWindow(x, y0, y1) {
      seg(x, (y0 + y1) / 2, x, (y0 + y1) / 2, { rw: 0.02, hue: 46, sat: 75, light: 52, role: 'window' });
      seg(x, y0, x, y1, { rw: 0.012, hue: 52, sat: 35, light: 90, role: 'window' });
    }
    function addHouse(cx, base, hw, bodyH, roofH, roofHue) {
      const wallTop = base - bodyH;
      const peak = wallTop - roofH;
      const ribs = 5;
      for (let i = 0; i <= ribs; i++) {
        const y = base - bodyH * (i / ribs);
        seg(cx - hw, y, cx + hw, y, {
          rh: bodyH / ribs * 0.85,
          hue: 222, sat: 36, light: 13 + (i % 2) * 2,
          role: 'house'
        });
      }
      const rr = 4;
      for (let i = 0; i <= rr; i++) {
        const t = i / rr;
        const y = wallTop - roofH * t;
        const half = hw * (1 - t * 0.92);
        seg(cx - half, y, cx + half, y, {
          rh: roofH / rr * 0.9,
          hue: roofHue, sat: 48, light: 22,
          role: 'roof'
        });
      }
      addStroke([
        { nx: cx - hw, ny: base },
        { nx: cx - hw, ny: wallTop },
        { nx: cx, ny: peak },
        { nx: cx + hw, ny: wallTop },
        { nx: cx + hw, ny: base }
      ], { rw: 0.007, hue: 230, sat: 28, light: 8, role: 'outline' });
      const winY = wallTop + bodyH * 0.28;
      const winH = Math.min(0.028, bodyH * 0.38);
      if (hw >= 0.046) {
        addWindow(cx - hw * 0.38, winY, winY + winH);
        addWindow(cx + hw * 0.38, winY, winY + winH);
      } else {
        addWindow(cx, winY, winY + winH);
      }
    }
    function addChurch(cx, base) {
      addHouse(cx, base, 0.062, 0.082, 0.04, 238);
      const tipY = 0.45;
      const footY = base - 0.09;
      const sRows = 16;
      for (let i = 0; i <= sRows; i++) {
        const t = i / sRows;
        const y = tipY + (footY - tipY) * t;
        const hw = 0.005 + 0.024 * t;
        seg(cx - hw, y, cx + hw, y, {
          rh: (footY - tipY) / sRows * 0.95,
          hue: 228, sat: 30, light: 10,
          role: 'steeple'
        });
      }
      addStroke([
        { nx: cx, ny: tipY },
        { nx: cx - 0.03, ny: footY },
        { nx: cx + 0.03, ny: footY },
        { nx: cx, ny: tipY }
      ], { rw: 0.006, hue: 232, sat: 22, light: 7, role: 'outline' });
      seg(cx, tipY + 0.055, cx, tipY + 0.085, { rw: 0.007, hue: 50, sat: 70, light: 78, role: 'window' });
      seg(cx, base - 0.04, cx, base - 0.004, { rw: 0.01, hue: 32, sat: 40, light: 24, role: 'outline' });
    }

    addHouse(0.36, 0.90, 0.042, 0.058, 0.04, 24);
    addHouse(0.46, 0.895, 0.05, 0.072, 0.048, 252);
    addChurch(0.585, 0.905);
    addHouse(0.71, 0.90, 0.052, 0.08, 0.05, 18);
    addHouse(0.82, 0.91, 0.04, 0.058, 0.038, 258);
    addHouse(0.915, 0.915, 0.034, 0.048, 0.032, 28);

    seg(-0.05, 0.985, 1.05, 0.985, { rh: 0.045, hue: 222, sat: 34, light: 8, role: 'ground' });

    function addFlame(cx, tipY, baseY, halfTip, halfBase, hueV, lightV) {
      const n = 30;
      const left = [];
      const right = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const y = tipY + (baseY - tipY) * Math.pow(t, 0.9);
        const sway = Math.sin(t * 6.3 + cx * 18) * (0.01 + 0.022 * t);
        const half = halfTip + (halfBase - halfTip) * Math.pow(t, 0.7);
        const x = cx + sway;
        const bend = Math.sin(t * 16 + cx) * 0.007;
        addStroke([
          { nx: x - half, ny: y },
          { nx: x, ny: y + bend },
          { nx: x + half, ny: y - bend }
        ], {
          rh: ((baseY - tipY) / n) * 1.05,
          hue: hueV + (i % 3) * 4,
          sat: 32,
          light: lightV + (i % 4),
          role: 'flame'
        });
        left.push({ nx: x - half, ny: y });
        right.push({ nx: x + half, ny: y });
      }
      addStroke(left, { rw: 0.008, hue: hueV + 15, sat: 28, light: lightV + 10, role: 'outline' });
      addStroke(right, { rw: 0.007, hue: 190, sat: 22, light: lightV + 14, role: 'outline' });
    }
    addFlame(0.145, 0.02, 1.02, 0.004, 0.095, 158, 7);
    addFlame(0.095, 0.20, 1.0, 0.003, 0.05, 168, 6);
    addFlame(0.195, 0.30, 0.98, 0.003, 0.042, 148, 8);
    const vein = [];
    for (let i = 0; i <= 26; i++) {
      const t = i / 26;
      vein.push({ nx: 0.14 + Math.sin(t * 7.5) * 0.028, ny: 0.08 + t * 0.88 });
    }
    addStroke(vein, { rw: 0.01, hue: 172, sat: 30, light: 18, role: 'vein' });

    return plan;
  }

  function paintStarryPoint(p) {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    if (w < 2 || h < 2) return;
    const m = Math.min(w, h);
    const x = p.nx * w + (p.ox || 0) * m;
    const y = p.ny * h + (p.oy || 0) * m;
    const r = Math.max(0.8, (p.rw || 0) * w + (p.rh || 0) * h + (p.rm || 0) * m);
    hue = p.hue;
    sat = p.sat;
    light = p.light;
    if (p.lift || !starryLast) fillRibbon(x, y, r, x, y, r);
    else fillRibbon(starryLast.x, starryLast.y, starryLast.r, x, y, r);
    starryLast = { x, y, r };
  }

  function stopStarry(restore) {
    const was = starryOn;
    starryOn = false;
    starryPlan = [];
    starryIdx = 0;
    starryLast = null;
    starryLastTs = 0;
    btnStarry.classList.remove('active');
    btnStarry.setAttribute('aria-pressed', 'false');
    btnStarry.textContent = 'Starry Night';
    if (!autoOn) setPracticeText('');
    if (restore && was && savedColor && !autoOn) {
      hue = savedColor.hue;
      sat = savedColor.sat;
      light = savedColor.light;
      savedColor = null;
      updateColorUI();
    }
  }

  function startStarry() {
    if (starryOn) return;
    if (autoOn) setAuto(false);
    hideBrushHud();
    practiceDone = false;
    setPracticeText('Playing the real Starry Night.');
    savedColor = { hue, sat, light };
    clearCanvas();
    starryPlan = buildStarryPlan();
    starryIdx = 0;
    starryLast = null;
    starryLastTs = 0;
    starryOn = true;
    btnStarry.classList.add('active');
    btnStarry.setAttribute('aria-pressed', 'true');
    btnStarry.textContent = 'Stop Night';
    drawing = false;
    pointerId = null;
    touchId = null;
    last = null;
  }

  function stepStarry(ts) {
    if (!starryPlan.length) { stopStarry(true); return; }
    const now = ts || performance.now();
    let dt = starryLastTs ? now - starryLastTs : 16;
    starryLastTs = now;
    if (dt < 0) dt = 0;
    if (dt > 48) dt = 48;
    let n = Math.round(dt * starryPlan.length / STARRY_MS);
    if (n < 1) n = 1;
    if (n > 28) n = 28;
    while (n > 0 && starryIdx < starryPlan.length) {
      paintStarryPoint(starryPlan[starryIdx++]);
      n--;
    }
    if (starryIdx >= starryPlan.length) stopStarry(true);
    else updateColorUI();
  }

  function setAuto(on, opts) {
    opts = opts || {};
    if (on && starryOn) stopStarry(true);
    if (!on) finishStroke();
    autoOn = !!on;
    btnAuto.classList.toggle('active', autoOn);
    btnAuto.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
    btnAuto.textContent = autoOn ? 'Stop' : 'Autopilot';
    drawing = false;
    pointerId = null;
    touchId = null;
    last = null;
    if (autoOn) {
      practiceDone = false;
      savedColor = { hue, sat, light };
      flyMemory = freshMemory();
      lookPass = 0;
      lastIssues = [];
      lastDistance = null;
      lastStats = '';
      critiqueText = '';
      fixingText = '';
      lookPhase = 'paint';
      beginPaintPass();
      return;
    }
    autoLast = null;
    flyPlan = [];
    flyIdx = 0;
    flyPhase = 0;
    flyLastTs = 0;
    critiquePauseUntil = 0;
    if (!opts.finished) {
      practiceDone = false;
      lookPass = 0;
      lookPhase = 'idle';
      lastIssues = [];
      critiqueText = '';
      setPracticeText('');
      hideBrushHud();
    }
    if (savedColor && !starryOn) {
      hue = savedColor.hue;
      sat = savedColor.sat;
      light = savedColor.light;
      savedColor = null;
      updateColorUI();
    }
  }

  btnAuto.onclick = () => setAuto(!autoOn);
  btnInvent.onclick = () => setInvent(!inventOn);
  btnStarry.onclick = () => {
    if (starryOn) stopStarry(true);
    else startStarry();
  };

  function tick(ts) {
    if (!document.hidden) {
      if (starryOn) stepStarry(ts);
      else if (autoOn) stepFly(ts);
    }
    requestAnimationFrame(tick);
  }

  document.getElementById('btnClear').onclick = () => {
    if (starryOn) stopStarry(true);
    if (autoOn) setAuto(false);
    discardStroke();
    hideBrushHud();
    practiceDone = false;
    lookPass = 0;
    lookPhase = 'idle';
    lastIssues = [];
    critiqueText = '';
    setPracticeText('');
    clearCanvas();
  };
  document.getElementById('btnSave').onclick = () => {
    const a = document.createElement('a');
    a.download = 'purple-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);
  updateColorUI();
  resize();
  clearCanvas();
  const bootParams = new URLSearchParams(location.search);
  let inventPref = false;
  try { inventPref = localStorage.getItem('purpleDrawInventBrushes') === '1'; } catch (_) {}
  const inventQuery = (bootParams.get('invent') || '').toLowerCase();
  if (inventQuery === '1' || inventQuery === 'on') inventPref = true;
  if (inventQuery === '0' || inventQuery === 'off') inventPref = false;
  if (inventPref) setInvent(true);
  if ((bootParams.get('painting') || '').toLowerCase() === 'starry') {
    startStarry();
  }
  window.__flyDraw = {
    state: function () {
      const note = document.getElementById('practiceNote');
      return {
        phase: note.dataset.phase || '',
        pass: note.dataset.pass || '',
        text: note.textContent,
        issues: note.dataset.issueIds || '',
        distance: note.dataset.distance || '',
        stats: note.dataset.stats || '',
        memory: flyMemory,
        invent: btnInvent.getAttribute('aria-pressed'),
        hint: inventHint.textContent
      };
    },
    paintMemory: function (mem) {
      if (autoOn) setAuto(false);
      if (starryOn) stopStarry(false);
      discardStroke();
      clearCanvas();
      paintPlanSync(canvas, applyMemory(buildStarryPlan(), mem || memoryIdentity()));
      const issues = lookAtPainting();
      return {
        issues: issues.map(function (item) { return item.id + ':' + item.severity.toFixed(2) + ':' + item.say; }),
        distance: lastDistance,
        stats: lastStats
      };
    }
  };
  requestAnimationFrame(tick);
})();
</script>
