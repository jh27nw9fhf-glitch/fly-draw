<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Purple Draw</title>
<style>
  :root {
    --bg: #12081c;
    --panel: #1e1230;
    --ink: #f3e8ff;
    --accent: #c084fc;
    --muted: #a78bba;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, system-ui, Segoe UI, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid #3b2760;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 700; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border-bottom: 1px solid #3b2760;
  }
  button {
    border: 0; border-radius: 12px; padding: 9px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: #2d1f4a; color: var(--ink);
  }
  button:active { background: var(--accent); color: #1a0b2e; }
  button.danger { background: #3a2140; color: #ffb4c8; }
  #toolbar label { font-size: 12px; color: var(--muted); }
  #toolbar input[type=range] { width: 90px; accent-color: var(--accent); }
  #stage {
    flex: 1; position: relative; min-height: 0;
    background: var(--bg); touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #swatch {
    width: 28px; height: 28px; border-radius: 8px;
    border: 2px solid #fff3; background: hsl(280 80% 55%);
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Purple Draw</h1>
  </header>
  <div id="toolbar">
    <div id="swatch" title="Purple only"></div>
    <label>Light</label>
    <input id="light" type="range" min="25" max="75" value="55" />
    <label>Size</label>
    <input id="size" type="range" min="4" max="48" value="14" />
    <button id="btnClear" class="danger">Clear</button>
    <button id="btnSave">Save</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const swatch = document.getElementById('swatch');
  const PURPLE_HUE = 280;
  let light = 55, size = 14, dpr = 1;
  let drawing = false;
  let pointerId = null;
  let touchId = null;
  let last = null;
  const touchDevice = navigator.maxTouchPoints > 0;

  function hsl() { return `hsl(${PURPLE_HUE} 80% ${light}%)`; }
  function updateSwatch() { swatch.style.background = hsl(); }

  document.getElementById('light').oninput = (e) => {
    light = +e.target.value;
    updateSwatch();
  };
  document.getElementById('size').oninput = (e) => { size = +e.target.value; };

  function resize() {
    const stage = document.getElementById('stage');
    const nextDpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssW = Math.max(1, stage.clientWidth);
    const cssH = Math.max(1, stage.clientHeight);
    const nextW = Math.max(1, Math.round(cssW * nextDpr));
    const nextH = Math.max(1, Math.round(cssH * nextDpr));
    if (canvas.width === nextW && canvas.height === nextH && dpr === nextDpr) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return;
    }
    const snap = document.createElement('canvas');
    snap.width = canvas.width;
    snap.height = canvas.height;
    snap.getContext('2d').drawImage(canvas, 0, 0);
    dpr = nextDpr;
    canvas.width = nextW;
    canvas.height = nextH;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (snap.width && snap.height) ctx.drawImage(snap, 0, 0, cssW, cssH);
  }

  function clearCanvas() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    last = null;
  }

  // One filled stadium per sample gap. Round caps are the same radius as the
  // body, so a slow or sparse finger still lays a solid ribbon. iPad Safari
  // paints per-move stroke()+round lineCap as fat dots on a hairline.
  function fillRibbon(x0, y0, r0, x1, y1, r1) {
    r0 = Math.max(0.5, r0);
    r1 = Math.max(0.5, r1);
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    ctx.fillStyle = hsl();
    ctx.beginPath();
    if (len < 0.01) {
      ctx.arc(x0, y0, Math.max(r0, r1), 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    const px = -dy / len, py = dx / len;
    const left = Math.atan2(py, px);
    ctx.arc(x0, y0, r0, left, left + Math.PI, false);
    ctx.arc(x1, y1, r1, left + Math.PI, left + Math.PI * 2, false);
    ctx.closePath();
    ctx.fill();
  }

  function drawTo(x, y) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    const w = size;
    if (!last) {
      last = { x, y, w };
      fillRibbon(x, y, w / 2, x, y, w / 2);
      return;
    }
    const dist = Math.hypot(x - last.x, y - last.y);
    if (dist < 0.15 && Math.abs(w - last.w) < 0.25) return;
    fillRibbon(last.x, last.y, last.w / 2, x, y, w / 2);
    last = { x, y, w };
  }

  function localPoint(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  function pointerPoints(e) {
    let list = null;
    try {
      if (typeof e.getCoalescedEvents === 'function') list = e.getCoalescedEvents();
    } catch (_) { list = null; }
    const src = list && list.length ? list : [e];
    const out = [];
    for (const ev of src) {
      if (ev.clientX == null || ev.clientY == null) continue;
      out.push(localPoint(ev.clientX, ev.clientY));
    }
    return out;
  }

  function touchPoint(e, useChanged) {
    const list = (!useChanged && e.touches && e.touches.length) ? e.touches : e.changedTouches;
    if (!list || !list.length) return null;
    let t = null;
    for (let i = 0; i < list.length; i++) {
      if (touchId == null || list[i].identifier === touchId) { t = list[i]; break; }
    }
    if (!t) return null;
    return { id: t.identifier, ...localPoint(t.clientX, t.clientY) };
  }

  function onPointerDown(e) {
    if (touchDevice && e.pointerType === 'touch') return;
    if (pointerId !== null || touchId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pointerId = e.pointerId;
    drawing = true;
    last = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    for (const p of pointerPoints(e)) drawTo(p.x, p.y);
  }

  function onPointerMove(e) {
    if (!drawing || e.pointerId !== pointerId) return;
    e.preventDefault();
    for (const p of pointerPoints(e)) drawTo(p.x, p.y);
  }

  function onPointerUp(e) {
    if (pointerId === null || e.pointerId !== pointerId) return;
    if (e.cancelable) e.preventDefault();
    if (drawing) {
      for (const p of pointerPoints(e)) drawTo(p.x, p.y);
    }
    drawing = false;
    pointerId = null;
    last = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  function onTouchDown(e) {
    if (touchId !== null || pointerId !== null) return;
    e.preventDefault();
    const p = touchPoint(e, false);
    if (!p || Number.isNaN(p.x)) return;
    touchId = p.id;
    drawing = true;
    last = null;
    drawTo(p.x, p.y);
  }

  function onTouchMove(e) {
    if (!drawing || touchId === null) return;
    e.preventDefault();
    const p = touchPoint(e, false);
    if (!p || Number.isNaN(p.x)) return;
    drawTo(p.x, p.y);
  }

  function onTouchUp(e) {
    if (touchId === null) return;
    const p = touchPoint(e, true);
    if (e.cancelable) e.preventDefault();
    if (drawing && p && p.id === touchId && !Number.isNaN(p.x)) drawTo(p.x, p.y);
    drawing = false;
    touchId = null;
    last = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  canvas.addEventListener('touchstart', onTouchDown, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchUp, { passive: false });
  canvas.addEventListener('touchcancel', onTouchUp, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.getElementById('btnClear').onclick = () => { clearCanvas(); };
  document.getElementById('btnSave').onclick = () => {
    const a = document.createElement('a');
    a.download = 'purple-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);
  updateSwatch();
  resize();
})();
</script>
</body>
</html>
