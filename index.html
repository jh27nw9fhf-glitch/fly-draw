<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fly Draw — Fruit Fly Brain Artist</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1f35;
    --ink: #e8ecff;
    --accent: #7cffb2;
    --fly: #ff6b9d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, system-ui, Segoe UI, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid #2a3358;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
  header .brain {
    width: 28px; height: 22px; border-radius: 40% 40% 45% 45%;
    background: linear-gradient(135deg, #ff8fb8, #a78bfa);
    box-shadow: 0 0 12px #ff8fb888; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.08); filter: brightness(1.2); } }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 10px; flex-wrap: wrap;
    background: var(--panel); border-bottom: 1px solid #2a3358;
  }
  button, .swatch {
    border: 0; border-radius: 12px; padding: 10px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; background: #2a3358; color: var(--ink);
  }
  button.active, button:active { background: var(--accent); color: #0b1220; }
  button.danger { background: #3a2140; color: #ffb4c8; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatch {
    width: 28px; height: 28px; padding: 0; border-radius: 50%;
    border: 2px solid transparent;
  }
  .swatch.on { border-color: #fff; transform: scale(1.1); }
  #stage {
    flex: 1; position: relative; min-height: 0;
    background:
      radial-gradient(circle at 20% 20%, #1c2444 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, #241830 0%, transparent 35%),
      var(--bg);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    background: #0008; padding: 8px 14px; border-radius: 999px;
    font-size: 13px; pointer-events: none; transition: opacity .4s;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brain" title="Drosophila brain"></div>
    <h1>Fly Draw — the fly draws with its brain</h1>
  </header>
  <div id="toolbar">
    <button id="btnDraw" class="active">✏️ Draw</button>
    <button id="btnBrain">🧠 Brain scribble</button>
    <button id="btnAuto">🪰 Autopilot</button>
    <div class="swatches" id="colors"></div>
    <button id="btnClear" class="danger">Clear</button>
    <button id="btnSave">Save 📷</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">Drag the fly — it draws. Tap 🧠 for a brain scribble!</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const colors = ['#7cffb2', '#ff6b9d', '#7dd3fc', '#fde047', '#c4b5fd', '#ffffff'];
  let color = colors[0];
  let mode = 'draw'; // draw | brain | auto
  let drawing = false;
  let fly = { x: 0, y: 0, a: 0, vx: 0, vy: 0 };
  let last = null;
  let autoT = 0;
  let brainPath = [];
  let brainI = 0;
  let dpr = 1;

  const colorBox = document.getElementById('colors');
  colors.forEach((col, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' on' : '');
    b.style.background = col;
    b.onclick = () => {
      color = col;
      [...colorBox.children].forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    };
    colorBox.appendChild(b);
  });

  function resize() {
    const stage = document.getElementById('stage');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fly.x = stage.clientWidth / 2;
    fly.y = stage.clientHeight / 2;
    redrawBg();
  }

  function redrawBg() {
    // keep drawings: only used on first paint via clear
  }

  function clear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    last = null;
  }

  function posFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function strokeTo(x, y, w = 3.2) {
    if (!last) { last = { x, y }; return; }
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.stroke();
    last = { x, y };
  }

  function drawFly() {
    // overlay fly each frame on a separate pass: erase old by redrawing from buffer
    // simpler: use two canvases — ink + overlay. Rebuild as overlay redraw each RAF.
  }

  // Ink layer stays; fly is drawn after snapshot trick each frame
  const overlay = document.createElement('canvas');
  const octx = overlay.getContext('2d');
  let inkSnap = null;

  function captureInk() {
    inkSnap = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }

  function paintFly(x, y, a) {
    if (inkSnap) ctx.putImageData(inkSnap, 0, 0);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    // body
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // thorax + head
    ctx.beginPath();
    ctx.ellipse(-9, 0, 5, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(-12, -2.5, 2.4, 0, Math.PI * 2);
    ctx.arc(-12, 2.5, 2.4, 0, Math.PI * 2);
    ctx.fill();
    // wings
    ctx.fillStyle = 'rgba(180,220,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(2, -8, 9, 4, -0.4, 0, Math.PI * 2);
    ctx.ellipse(2, 8, 9, 4, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // little brain glow on head
    ctx.fillStyle = 'rgba(255,143,184,0.85)';
    ctx.beginPath();
    ctx.ellipse(-8, -5, 3.2, 2.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function onDown(e) {
    e.preventDefault();
    hint.classList.add('hide');
    if (mode === 'auto') return;
    drawing = true;
    const p = posFromEvent(e);
    fly.x = p.x; fly.y = p.y;
    last = { x: p.x, y: p.y };
    captureInk();
    paintFly(fly.x, fly.y, fly.a);
  }
  function onMove(e) {
    e.preventDefault();
    if (!drawing || mode === 'auto') return;
    const p = posFromEvent(e);
    const dx = p.x - fly.x, dy = p.y - fly.y;
    fly.a = Math.atan2(dy, dx);
    fly.x = p.x; fly.y = p.y;
    strokeTo(p.x, p.y, mode === 'brain' ? 2.4 : 3.4);
    captureInk();
    paintFly(fly.x, fly.y, fly.a);
  }
  function onUp(e) {
    e.preventDefault();
    drawing = false;
    last = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });

  // Stylized Drosophila brain path (relative units 0..1), used by Brain scribble
  function makeBrainPath(cx, cy, s) {
    const pts = [];
    // left optic lobe
    for (let i = 0; i <= 40; i++) {
      const t = (i / 40) * Math.PI * 2;
      pts.push([cx - s * 0.55 + Math.cos(t) * s * 0.28, cy + Math.sin(t) * s * 0.38]);
    }
    // central brain
    for (let i = 0; i <= 36; i++) {
      const t = (i / 36) * Math.PI * 2;
      pts.push([cx + Math.cos(t) * s * 0.32, cy + Math.sin(t) * s * 0.26]);
    }
    // right optic lobe
    for (let i = 0; i <= 40; i++) {
      const t = (i / 40) * Math.PI * 2;
      pts.push([cx + s * 0.55 + Math.cos(t) * s * 0.28, cy + Math.sin(t) * s * 0.38]);
    }
    // antennal lobes (two small circles below)
    for (let i = 0; i <= 24; i++) {
      const t = (i / 24) * Math.PI * 2;
      pts.push([cx - s * 0.18 + Math.cos(t) * s * 0.12, cy + s * 0.42 + Math.sin(t) * s * 0.1]);
    }
    for (let i = 0; i <= 24; i++) {
      const t = (i / 24) * Math.PI * 2;
      pts.push([cx + s * 0.18 + Math.cos(t) * s * 0.12, cy + s * 0.42 + Math.sin(t) * s * 0.1]);
    }
    return pts;
  }

  function startBrain() {
    mode = 'brain';
    setActive('btnBrain');
    const w = canvas.width / dpr, h = canvas.height / dpr;
    brainPath = makeBrainPath(w / 2, h / 2 - 10, Math.min(w, h) * 0.28);
    brainI = 0;
    last = null;
    fly.x = brainPath[0][0];
    fly.y = brainPath[0][1];
  }

  function startAuto() {
    mode = 'auto';
    setActive('btnAuto');
    autoT = 0;
    last = null;
    const w = canvas.width / dpr, h = canvas.height / dpr;
    fly.x = w / 2; fly.y = h / 2;
    fly.vx = 2.2; fly.vy = 1.4;
  }

  function setActive(id) {
    ['btnDraw', 'btnBrain', 'btnAuto'].forEach(x => {
      document.getElementById(x).classList.toggle('active', x === id);
    });
  }

  document.getElementById('btnDraw').onclick = () => {
    mode = 'draw'; setActive('btnDraw'); last = null;
  };
  document.getElementById('btnBrain').onclick = startBrain;
  document.getElementById('btnAuto').onclick = startAuto;
  document.getElementById('btnClear').onclick = () => {
    clear(); captureInk(); paintFly(fly.x, fly.y, fly.a);
  };
  document.getElementById('btnSave').onclick = () => {
    // save without fly overlay if possible
    if (inkSnap) ctx.putImageData(inkSnap, 0, 0);
    const a = document.createElement('a');
    a.download = 'fly-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    paintFly(fly.x, fly.y, fly.a);
  };

  function tick() {
    if (mode === 'brain' && brainPath.length) {
      if (brainI < brainPath.length) {
        const [x, y] = brainPath[brainI];
        const dx = x - fly.x, dy = y - fly.y;
        fly.a = Math.atan2(dy, dx);
        fly.x = x; fly.y = y;
        strokeTo(x, y, 2.6);
        brainI++;
        captureInk();
        paintFly(fly.x, fly.y, fly.a);
      } else {
        mode = 'draw';
        setActive('btnDraw');
        last = null;
      }
    } else if (mode === 'auto') {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      autoT += 0.04;
      // wander + gentle loops (brain-ish)
      fly.vx += Math.sin(autoT * 1.7) * 0.35 + (Math.random() - 0.5) * 0.2;
      fly.vy += Math.cos(autoT * 1.3) * 0.35 + (Math.random() - 0.5) * 0.2;
      const sp = Math.hypot(fly.vx, fly.vy) || 1;
      fly.vx = (fly.vx / sp) * 3.2;
      fly.vy = (fly.vy / sp) * 3.2;
      fly.x += fly.vx;
      fly.y += fly.vy;
      fly.a = Math.atan2(fly.vy, fly.vx);
      if (fly.x < 20 || fly.x > w - 20) fly.vx *= -1;
      if (fly.y < 20 || fly.y > h - 20) fly.vy *= -1;
      fly.x = Math.max(20, Math.min(w - 20, fly.x));
      fly.y = Math.max(20, Math.min(h - 20, fly.y));
      strokeTo(fly.x, fly.y, 2.8);
      captureInk();
      paintFly(fly.x, fly.y, fly.a);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    // preserve ink roughly by not clearing on rotate — simple: keep drawing
    const prev = canvas.toDataURL();
    resize();
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
      captureInk();
      paintFly(fly.x, fly.y, fly.a);
    };
    img.src = prev;
  });

  resize();
  captureInk();
  paintFly(fly.x, fly.y, fly.a);
  requestAnimationFrame(tick);
  setTimeout(() => hint.classList.add('hide'), 5000);
})();
</script>
</body>
</html>
