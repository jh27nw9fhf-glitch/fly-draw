<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Purple Draw</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #ffffff; color: #333;
    font-family: -apple-system, system-ui, Segoe UI, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; padding: 8px 12px;
    background: #f5f5f7; border-bottom: 1px solid #ddd;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 700; color: #a855f7; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 10px; flex-wrap: wrap; align-items: center;
    background: #f5f5f7; border-bottom: 1px solid #ddd;
  }
  button {
    border: 0; border-radius: 12px; padding: 9px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: #eee; color: #333;
  }
  button:active { background: #a855f7; color: #fff; }
  button.danger { background: #ffe4e6; color: #be123c; }
  #toolbar label { font-size: 12px; color: #666; }
  #toolbar input[type=range] { width: 90px; accent-color: #a855f7; }
  #stage { flex: 1; position: relative; min-height: 0; background: #ffffff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; background: #ffffff; }
</style>
</head>
<body>
<div id="wrap">
  <header><h1>Purple Draw</h1></header>
  <div id="toolbar">
    <label>Size</label>
    <input id="size" type="range" min="4" max="48" value="14" />
    <button id="btnClear" class="danger">Clear</button>
    <button id="btnSave">Save</button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const PURPLE = '#a855f7';
  let size = 14, dpr = 1, drawing = false;

  document.getElementById('size').oninput = (e) => { size = +e.target.value; };

  function applyBrush() {
    ctx.strokeStyle = PURPLE;
    ctx.fillStyle = PURPLE;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function resize() {
    const stage = document.getElementById('stage');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  }

  function clear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function posFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function onDown(e) {
    e.preventDefault();
    const p = posFromEvent(e);
    if (!p || Number.isNaN(p.x)) return;
    drawing = true;
    applyBrush();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + 0.01, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function onMove(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = posFromEvent(e);
    if (!p || Number.isNaN(p.x)) return;
    applyBrush();
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function onUp(e) {
    if (e.cancelable) e.preventDefault();
    drawing = false;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('touchcancel', onUp, { passive: false });

  document.getElementById('btnClear').onclick = () => { clear(); };
  document.getElementById('btnSave').onclick = () => {
    const a = document.createElement('a');
    a.download = 'purple-draw.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', () => {
    const prev = canvas.toDataURL();
    resize();
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr); };
    img.src = prev;
  });

  resize();
})();
</script>
</body>
</html>
